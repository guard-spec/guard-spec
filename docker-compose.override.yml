# LOCAL DEVELOPMENT ONLY. `docker compose up` loads this file automatically.
#
# It turns on GUARD_ENV=dev and fills in the well-known throwaway credentials
# below, so the stack starts without any setup. The services accept them only
# because of GUARD_ENV=dev; without it they refuse to start.
#
# Never deploy with this file. In production run
#   docker compose -f docker-compose.yml up -d
# with real secrets in .env (see .env.example).
#
# The database passwords match earlier versions of this file, so an existing
# local volume keeps working. Values set in .env or the shell take precedence.

services:
  gateway:
    build:
      context: .
      dockerfile: build/gateway.Dockerfile
    volumes:
      - .:/src:ro          # source read-only (rebuild required for Go changes)
      - ./models:/models:ro
    environment:
      LOG_LEVEL: debug
      GUARD_ENV: ${GUARD_ENV:-dev}
      PGPASSWORD: ${PS_APP_PASSWORD:-ps_app}

  control-plane:
    build:
      context: .
      dockerfile: build/control-plane.Dockerfile
    environment:
      LOG_LEVEL: debug
      GUARD_ENV: ${GUARD_ENV:-dev}
      PGPASSWORD: ${PS_APP_PASSWORD:-ps_app}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-do-not-deploy}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-on-first-login}

  migrate:
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-ps}

  db-roles:
    environment:
      GUARD_ENV: ${GUARD_ENV:-dev}
      PGPASSWORD: ${POSTGRES_PASSWORD:-ps}
      PS_APP_PASSWORD: ${PS_APP_PASSWORD:-ps_app}

  ui:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: dev          # use dev stage (next dev with hot reload)
    volumes:
      - ./web:/app         # mount source for hot reload
      - /app/node_modules  # exclude node_modules from mount
    environment:
      NEXT_TELEMETRY_DISABLED: "1"

  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ps}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"   # expose for local DB tools (TablePlus, etc.)

  clickhouse:
    ports:
      - "8123:8123"
