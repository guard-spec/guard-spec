# LOCAL DEVELOPMENT ONLY. `docker compose up` loads this file automatically.
#
# It turns on GUARD_ENV=dev and fills in the well-known throwaway credentials
# below, so the stack starts without any setup. The services accept them only
# because of GUARD_ENV=dev; without it they refuse to start.
#
# Never deploy with this file. In production run
#   docker compose -f docker-compose.yml up -d
# with real secrets in .env (see .env.example).
#
# The superuser password matches earlier versions of this file, so an existing
# local volume keeps working; the db-roles service sets the application role's
# password on every start. Values set in .env or the shell take precedence.
#
# It also builds the images from source, under local names, instead of using
# the released ghcr.io images of docker-compose.yml: `docker compose up --build`
# rebuilds them after a change. (This is where the build sections live; there
# is no separate build file.)

services:
  gateway:
    image: guard-spec-gateway:latest
    build:
      context: .
      dockerfile: build/gateway.Dockerfile
    volumes:
      - .:/src:ro          # source read-only (rebuild required for Go changes)
      - ./models:/models:ro
    environment:
      GUARD_ENV: ${GUARD_ENV:-dev}
      PGPASSWORD: ${GUARDSPEC_APP_PASSWORD:-${PS_APP_PASSWORD:-guardspec_app}}

  # The model helpers run the same locally built gateway image (its `models`
  # binary and manifest).
  models-init:
    image: guard-spec-gateway:latest
    build:
      context: .
      dockerfile: build/gateway.Dockerfile

  models-pull:
    image: guard-spec-gateway:latest
    build:
      context: .
      dockerfile: build/gateway.Dockerfile

  control-plane:
    image: guard-spec-control-plane:latest
    build:
      context: .
      dockerfile: build/control-plane.Dockerfile
    environment:
      GUARD_ENV: ${GUARD_ENV:-dev}
      PGPASSWORD: ${GUARDSPEC_APP_PASSWORD:-${PS_APP_PASSWORD:-guardspec_app}}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-do-not-deploy}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-on-first-login}
      # base64 of "dev-only-insecure-mfa-key-000000"; refused outside GUARD_ENV=dev.
      MFA_ENC_KEY: ${MFA_ENC_KEY:-ZGV2LW9ubHktaW5zZWN1cmUtbWZhLWtleS0wMDAwMDA=}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:18081}
      # Development only: save upstreams with UPSTREAM_KEY_MAIN and test
      # connections to local models (Ollama on the host) with the key.
      UPSTREAM_KEY_ORGS: "${UPSTREAM_KEY_ORGS:-UPSTREAM_KEY_MAIN=*}"
      UPSTREAM_ALLOW_PRIVATE: ${CONTROL_PLANE_UPSTREAM_ALLOW_PRIVATE:-true}
      UPSTREAM_KEY_MAIN: ${UPSTREAM_KEY_MAIN:-}

  migrate:
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-ps}

  db-roles:
    environment:
      GUARD_ENV: ${GUARD_ENV:-dev}
      PGPASSWORD: ${POSTGRES_PASSWORD:-ps}
      GUARDSPEC_APP_PASSWORD: ${GUARDSPEC_APP_PASSWORD:-${PS_APP_PASSWORD:-guardspec_app}}

  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ps}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"   # expose for local DB tools (TablePlus, etc.)
