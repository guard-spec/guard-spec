    revision: b04c8d1ceb2f5cd4588862100d08de323dccfbaa
    file: 20231101.vi/train-00000-of-00004.parquet
    file_sha256: ec53cc9899be9287b10785c794745eeef94b2df52970ba2ebd1808bfa8d1599a
    row_group: 0
