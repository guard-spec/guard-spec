    license: BSD-3-Clause
    terms: Source code at a pinned tag, fetched from GitHub raw file URLs; used locally, never redistributed.
    sha256: 419562a15ef8da87a5c5c4bad4aa7a5ae27e4ad6476ed044e6da8d10db1bb869
