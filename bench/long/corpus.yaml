# Long-input benchmark corpus (bench/long/build.py, docs/benchmark.md
# "Long documents"). Only this file is committed: the builder downloads each
# source at the pinned revision into $BENCH_CACHE/long/src (default
# bench/.cache, gitignored), checks the SHA-256 of what it extracted, and
# writes the documents to $BENCH_CACHE/long/<profile>/docs.jsonl.
#
# Every source was checked for its terms (see `license` and `terms` below).
# Dropped sources are listed at the end with the reason.
#
# sha256 is the SHA-256 of the extracted UTF-8 text of the source (after the
# extraction in build.py), so a changed upstream file or a changed extractor
# is caught. An empty value means "not pinned yet": the builder prints the
# value to pin and goes on.

version: 1

# Token counts use the classifier's own tokenizer (guardspec-classifier v3b,
# models/manifest.yaml), content tokens without special tokens, as
# internal/onnx counts them.
tokenizer:
  model: guardspec-classifier@v3b
  sha256: 2b95ee17661f8dfbbceaba374f6d277a6b5d8e1898c070a16331622024f58c67

