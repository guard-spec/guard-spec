      - https://www.govinfo.gov/content/pkg/USCODE-2023-title35/html/USCODE-2023-title35.htm
      - https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11.htm
    license: Public domain (17 U.S.C. 105)
    terms: GovInfo content is public domain U.S. Government work; bulk use is allowed.
    sha256: 3b6e79e4f0e49db563f5a9a7b1d0016057a05f494a02476c57e28490f5e838dd
  gostd-en:
    lang: en
    genre: code
    kind: http-text
    # Go standard library at the go1.23.4 tag (BSD-3-Clause, golang/go LICENSE).
    base: https://raw.githubusercontent.com/golang/go/go1.23.4/
    paths:
      - src/net/http/server.go
      - src/net/http/transport.go
      - src/runtime/proc.go
      - src/runtime/mgc.go
      - src/go/types/expr.go
      - src/math/big/nat.go
