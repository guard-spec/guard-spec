    sha256: 29e96b3cdfad5e349bafccf08b85b7905a7f2842c79475fc4c4c1a00bbea5eb3

# Synthetic genres: generated by build.py from a fixed seed (project-written,
# Apache-2.0). "hardneg" is benign text about prompt injection and security.
synthetic:
  seed: 20261109
  genres: [logs, json, csv, email, chat, hardneg]
  langs: [en, vi]

# Attack payloads: attack rows of the eval/ dev half only (eval/README.md:
# ids whose last hex digit is 0-7), never train/ data and never the eval/
# holdout half. Until 2026-11-11 (RF-895d3533) they came from the holdout
# half; they moved to dev because the v6 gates select a model on the bench
# dev slice, and a model chosen on eval-holdout wording would leave no clean
# final measurement. The bench dev/holdout split of an attack document is a
# separate hash of the payload id (`split` below), so bench dev and bench
# holdout still use disjoint payloads. Bench numbers published before the
# change were measured on holdout payloads and are not directly comparable.
payloads:
  files: [eval/data/en.jsonl, eval/data/vi.jsonl]
  dev_last_hex: "01234567"
  min_chars: 40
  max_chars: 600

profiles:
  quick:
    # About 0.86M tokens of benign documents plus 0.7M in attack variants.
    sizes:
      wiki: [20000, 50000, 100000]
      default: [20000, 50000]
      synthetic: [20000]
    docs_per_size: 1
    payloads_per_lang: 12
    host_tokens: 2000
    segment_host_bytes: 28000
  full:
    # About 7.6M tokens of benign documents plus 1.9M in attack variants.
    sizes:
      wiki: [20000, 50000, 100000, 200000, 500000]
      default: [20000, 50000, 100000, 200000, 500000]
      synthetic: [20000, 50000, 100000, 200000]
    # Sizes a source has too little text for are skipped (Vietnamese
    # literature stops at 50k tokens, Vietnamese laws at 100k).
    docs_per_size: 1
    payloads_per_lang: 32
    host_tokens: 2000
    segment_host_bytes: 28000

# Dev/holdout split of every document (build.py split_of, the eval/ convention):
# the last hex digit of SHA-256(key) is 0-7 for dev and 8-f for holdout, with
# key the payload id of an attack or control document (every variant of a
# payload is in one slice) and the document id otherwise. cmd/benchlong reports
# the dev and holdout slices next to the totals; tune on dev only.
split:
  field: split
  rule: sha256-last-hex-digit
  key: {attack: payload_id, control: payload_id, benign: id, host: id}

# SHA-256 of docs.jsonl per profile: a rebuild must give the same file.
# Pinned again on 2026-11-11 (RF-895d3533) when the payloads moved from the
# eval/ holdout half to the dev half (`payloads` above): the benign and host
# documents are byte-identical to the previous files (74ce3b30… quick,
# 36df6248… full), only the control and attack documents carry other
# payloads (same count, positions, boundaries, split variants, sizes and
# seeds). Before that, pinned on 2026-11-10 (R0) when the `split` field was
# added to every document (b38614e2… quick and a5dcef89… full without it).
outputs:
  quick: 78236eb56dbf71c335c8a1cf043487a71fe3e11360535c389abe47c1d07c3399
  full: bfd045cc60e704a4fbef0f3627527b39041572566ca4efe310043426d34865cf

dropped:
  - source: Project Gutenberg (gutenberg.org)
    reason: >-
      The robot access policy (gutenberg.org/policy/robot_access.html) says the
      site is for human users only and allows automated downloads only through
      a full mirror or the bulk harvest endpoint; fetching a few books by ID is
      neither, so the source is dropped.
  - source: Commercial Vietnamese legal portals (e.g. thuvienphapluat.vn)
    reason: >-
      Their terms were not verified to allow automated download, so they are
      not used; the Vietnamese laws come from vi.wikisource instead (public
      domain by law, see above).
