# Synthetic genres: generated by build.py from a fixed seed (project-written,
# Apache-2.0). "hardneg" is benign text about prompt injection and security.
synthetic:
  seed: 20261109
  genres: [logs, json, csv, email, chat, hardneg]
  langs: [en, vi]

# Attack payloads: attack rows of the eval/ dev half only (eval/README.md:
# ids whose last hex digit is 0-7), never train/ data and never the eval/
# holdout half. Until 2026-11-11 (RF-895d3533) they came from the holdout
# half; they moved to dev because the v6 gates select a model on the bench
# dev slice, and a model chosen on eval-holdout wording would leave no clean
# final measurement. The bench dev/holdout split of an attack document is a
# separate hash of the payload id (`split` below), so bench dev and bench
# holdout still use disjoint payloads. Bench numbers published before the
# change were measured on holdout payloads and are not directly comparable.
payloads:
  files: [eval/data/en.jsonl, eval/data/vi.jsonl]
  dev_last_hex: "01234567"
  min_chars: 40
  max_chars: 600

# A profile names its sources (`sources`; all of them when absent) and its
# synthetic genres (`synthetic`; all when absent). docs_per_size is one number
# or a map by "<genre>-<lang>", "<genre>" or "default".
profiles:
  quick:
    # About 0.86M tokens of benign documents plus 0.7M in attack variants.
    sources: [wikipedia-en, wikipedia-vi, uscode-en, gostd-en, wikisource-vi-literature, wikisource-vi-legal]
    sizes:
      wiki: [20000, 50000, 100000]
      default: [20000, 50000]
      synthetic: [20000]
    docs_per_size: 1
    payloads_per_lang: 12
    host_tokens: 2000
    segment_host_bytes: 28000
  full:
    # About 7.6M tokens of benign documents plus 1.9M in attack variants.
    sources: [wikipedia-en, wikipedia-vi, uscode-en, gostd-en, wikisource-vi-literature, wikisource-vi-legal]
    sizes:
      wiki: [20000, 50000, 100000, 200000, 500000]
      default: [20000, 50000, 100000, 200000, 500000]
      synthetic: [20000, 50000, 100000, 200000]
    # Sizes a source has too little text for are skipped (Vietnamese
    # literature stops at 50k tokens, Vietnamese laws at 100k).
    docs_per_size: 1
    payloads_per_lang: 32
    host_tokens: 2000
    segment_host_bytes: 28000
  long:
    # Benign documents only, 100k and 200k tokens: the false-positive rate
    # at those sizes with enough documents per cell (docs/benchmark.md "Long
    # documents"; RF-895d3533 R2b). About 19.5M tokens: 32 EN and 33 VI
    # documents per size from the `long` sources above plus the synthetic
    # genres with their own seed (so no synthetic text of quick/full
    # repeats). No hosts and no attacks (payloads_per_lang 0): the fused
    # score is a maximum over 2,048-byte chunks, so a payload's detection
    # does not depend on the length of its host beyond its own chunk, which
    # the 2k-token hosts of quick/full already measure. Document ids carry
    # the prefix `long-`, so their dev/holdout split is independent of the
    # quick/full documents.
    sources: [wikipedia2-en, uscode2-en, gostd2-en, k8s-examples-en, k8s-docs-tasks-en, k8s-docs-reference-en, k8s-docs-en, wikisource-en,
              rfc-en, apache-logs-en, wikipedia2-vi, wikisource-vi-laws, wikisource-vi-prose, k8s-docs-vi,
              react-docs-vi, vue-docs-vi]
    synthetic: [logs, json, csv, email, chat, hardneg]
    synthetic_seed: 20261111
    id_prefix: long-
    sizes:
      default: [100000, 200000]
      synthetic: [100000, 200000]
    docs_per_size:
      default: 0
      wiki-en: 6
      legal-en: 5
      code-en: 4
      docs-en: 5
      prose-en: 5
      rfc-en: 4
      weblog-en: 2
      logs-en: 1
      wiki-vi: 11
      legal-vi: 7
      prose-vi: 6
      docs-vi: 2
      logs-vi: 2
      json-vi: 1
      csv-vi: 1
      email-vi: 1
      chat-vi: 1
      hardneg-vi: 1
    payloads_per_lang: 0
    host_tokens: 2000
    segment_host_bytes: 28000
  long5:
    # Benign documents of 100k and 200k tokens from the `long5` sources and
    # the synthetic genres with their own seed: 38 English and 37
    # Vietnamese documents per size (RF-895d3533 R5,
    # train/reports/r5_preregistration.md). No attacks here: the embedded
    # attack documents of R5 are built from these hosts by
    # bench/long/embed_long.py. Ids carry the prefix `long5-`, so the
    # dev/holdout split is independent of every other profile.
    sources: [wikipedia5-en, uscode5-en, k8s-kubelet5-en, rustbook5-en, k8s-blog5-en, wikisource5-en, rfc5-en,
              nginx-logs5-en, wikipedia5-vi, wikisource5-vi-laws, wikisource5-vi-prose]
    synthetic: [logs, json, csv, email, chat, hardneg]
    synthetic_seed: 20261112
    id_prefix: long5-
    sizes:
      default: [100000, 200000]
      synthetic: [100000, 200000]
    docs_per_size:
      default: 0
      wiki-en: 8
      legal-en: 5
      code-en: 3
      docs-en: 5
      prose-en: 5
      rfc-en: 4
      weblog-en: 2
      wiki-vi: 23
      legal-vi: 6
      prose-vi: 2
      logs: 1
      json: 1
      csv: 1
      email: 1
      chat: 1
      hardneg: 1
    payloads_per_lang: 0
    host_tokens: 2000
    segment_host_bytes: 28000

  long6:
    # The final holdout of v7 (RF-895d3533 R6, train/reports/v7_preregistration.md):
