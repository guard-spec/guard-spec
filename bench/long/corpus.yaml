dropped:
  - source: Project Gutenberg (gutenberg.org)
    reason: >-
      The robot access policy (gutenberg.org/policy/robot_access.html) says the
      site is for human users only and allows automated downloads only through
      a full mirror or the bulk harvest endpoint; fetching a few books by ID is
      neither, so the source is dropped.
  - source: Commercial Vietnamese legal portals (e.g. thuvienphapluat.vn)
    reason: >-
      Their terms were not verified to allow automated download, so they are
      not used; the Vietnamese laws come from vi.wikisource instead (public
      domain by law, see above).
  - source: Python library reference (python/cpython Doc/library, PSF-2.0)
    reason: >-
      Tried for the `long` profile (2026-11-11) and dropped: the v6 training
      data holds the same documentation (rows doc_en cpython@v3.12.7), so 98 of
      its 265 files shared a 50-token shingle with a training row. The
      Kubernetes documentation is used instead.
  - source: Vietnamese legal datasets on Hugging Face (minhnguyent546/vietnamese-legal-documents and its source th1nhng0/vietnamese-legal-documents; YuITC/Vietnamese-Legal-Documents)
    reason: >-
      Considered for `long5` (2026-11-11, R5) and not used: the first is a copy
      of thuvienphapluat.vn (its card says so), the portal dropped above; the
      second is a retrieval corpus without a stated origin of its text. The
      Vietnamese laws of `long5` are the units of the Vietnamese Wikisource dump
      that `long` left unused.
