  # several genres. Their text is disjoint from the sources above (other row
  # groups, titles, files and pages), so the `long` documents never repeat a
  # quick/full document. Several sources of one genre and language make one
  # pool, their units interleaved (build.py). exclude.json lists, per source,
  # the units that share a 50-token shingle with a v6 training or validation
  # row (train/data/bench_guard.py); build.py skips them after checking the
  # source's sha256 (which pins the extraction before the exclusion).
