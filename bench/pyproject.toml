[project]
name = "guardspec-bench"
version = "0.1.0"
description = "Reproducible benchmark: Guard Spec versus other prompt-injection detectors (docs/benchmark.md)"
requires-python = "==3.12.*"
license = "Apache-2.0"
dependencies = [
    "huggingface_hub==1.33.0",
    "numpy==2.1.3",
    "onnxruntime==1.31.1",
    "pyarrow==26.0.1",
    "tokenizers==0.22.2",
]

[project.optional-dependencies]
# Meta Prompt Guard 2 (gated on Hugging Face, Llama 4 Community License):
# only for users who accepted the license, with their own HF_TOKEN.
promptguard = [
    "torch==2.13.0",
    "transformers==5.10.2",
]

[tool.uv]
package = false

# CPU-only torch on Linux (the PyPI wheel pulls the CUDA libraries);
# macOS wheels on PyPI are CPU/MPS already.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
