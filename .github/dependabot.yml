version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      golang-x:
        patterns: ["golang.org/x/*"]
    open-pull-requests-limit: 10

  # The base images (Chainguard Wolfi) are rebuilt with fixes every day; their
  # digest pins are bumped daily so a released image never lags.
  - package-ecosystem: docker
    directories:
      - /build
    schedule:
      interval: daily

  # Pinned scanners (govulncheck), kept out of the main module.
  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: weekly

  # Python: training, benchmark and the Python examples (uv.lock).
  - package-ecosystem: uv
    directories:
      - /train
      - /bench
      - /examples/python/*
    schedule:
      interval: weekly
    groups:
      uv-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A Postgres major upgrade needs pg_upgrade of existing volumes; it is
      # done as a planned upgrade with a migration path, not by Dependabot.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  # The admin UI and the TypeScript examples. Minor and patch updates come as
  # one grouped pull request per directory; majors one by one.
  - package-ecosystem: npm
    directories:
      - /web
      - /examples/typescript/openai-sdk
      - /examples/typescript/vercel-ai-sdk
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
