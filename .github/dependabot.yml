version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      golang-x:
        patterns: ["golang.org/x/*"]
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directories:
      - /build
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A Postgres major upgrade needs pg_upgrade of existing volumes; it is
      # done as a planned upgrade with a migration path, not by Dependabot.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  # The admin UI and the TypeScript examples. Minor and patch updates come as
  # one grouped pull request per directory; majors one by one.
  - package-ecosystem: npm
    directories:
      - /web
      - /examples/typescript/openai-sdk
      - /examples/typescript/vercel-ai-sdk
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
