name: "False positive (benign blocked)"
description: A legitimate text that Guard Spec blocked, routed or flagged.
title: "False positive: "
labels: [detection, false-positive, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thank you: false-positive reports are how the rules and the classifier stop getting in the way. How a report is triaged, and whether it goes to training or hold-out data, is described in [docs/red-team.md](https://github.com/guard-spec/guard-spec/blob/main/docs/red-team.md).

        > [!WARNING]
        > **No personal data, secrets or customer data.** This issue is public. Post a **synthetic or anonymised** text only: replace names, e-mail addresses, phone numbers, account and ID numbers, API keys, internal host names and customer content with placeholders (`user@example.com`, `[NAME]`, `sk-REDACTED`). Keep the wording that triggered the block.

        If you found a text that gets **through** the guard, use the "Bypass" form; severe bypasses go to [private vulnerability reporting](https://github.com/guard-spec/guard-spec/security/advisories/new) (SECURITY.md).

        The admin UI fills most of this form for you: **Request log → Report** on the row.
  - type: textarea
    id: prompt
    attributes:
      label: Prompt
      description: |
        The text that was blocked, after removing personal data, secrets and customer data.
        Synthetic or anonymised only. If you cannot share it, describe its shape instead (language, length, the words that seem to trigger it).
      render: text
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - English
        - Vietnamese (with diacritics)
        - Vietnamese (without diacritics)
        - Vietnamese (teencode)
        - Mixed
        - Other
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it appeared
      description: The part of the request that carried the text.
      options:
        - User prompt
        - RAG document
        - Tool result
        - MCP tool description
        - Other (system message, model output)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Guard Spec version
      description: The gateway version (`gateway --version`, or the Models page of the admin UI).
      placeholder: v0.5.0
    validations:
      required: true
  - type: input
    id: layers
    attributes:
      label: Detector layers
      description: DETECTOR_LAYERS, the classifier version and the fusion (the Models page shows them).
      placeholder: l1,l2,l3 · guardspec-classifier@v3b · fusion logreg
    validations:
      required: true
  - type: textarea
    id: audit
    attributes:
      label: Response or audit fields
      description: |
        From the request log row or POST /guardrail/scan: decision (action), injection_score, label, the layer or rule that decided, anomaly_score.
        No API keys or request IDs of other people.
      render: text
  - type: textarea
    id: expected
    attributes:
      label: Expected outcome
      description: The legitimate use of the text and what should have happened (allow, or a lower score).
    validations:
      required: true
  - type: input
    id: pair
    attributes:
      label: Related report
      description: Optional. The issue number of an attack twin of this text (a minimal pair), so both land in the same data split.
      placeholder: "#123"
  - type: checkboxes
    id: consent
    attributes:
      label: Confirmation
      options:
        - label: The text is synthetic or anonymised and contains no personal data, secrets or customer data.
          required: true
        - label: I agree that the text may be added to the project's training or hold-out data and published under Apache-2.0.
          required: true
