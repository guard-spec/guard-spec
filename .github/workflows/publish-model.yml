name: Publish model

# Manual. Uploads a guardspec-classifier version (default v3b) to Hugging Face
# from its GitHub Release mirror (tag model-guardspec-classifier-<version>),
# after train/hf/stage.sh checks every file against its pins
# (build/gateway-full.l2.sha256 for v3b, train/hf/<version>/SHA256SUMS
# otherwise). Needs the repository
# secret HF_TOKEN with write access to the Hugging Face org. The job summary
# shows the Hugging Face commit to pin as `revision` in models/manifest.yaml
# and in the GATEWAY_FULL_L2_SOURCE variable.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Model version (release tag model-guardspec-classifier-<version>)
        default: v3b
      hf_repo:
        description: Hugging Face repository (org/name)
        default: guard-spec/guardspec-classifier
      private:
        description: Create the repository as private (it keeps its visibility if it exists)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in ""|*[!a-z0-9.-]*) echo "::error::bad version: $VERSION"; exit 1 ;; esac
          gh release download "model-guardspec-classifier-$VERSION" -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/model"
      - name: Stage and check
        env:
          VERSION: ${{ inputs.version }}
        run: train/hf/stage.sh "$RUNNER_TEMP/stage" "$RUNNER_TEMP/model" "$VERSION"
      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ inputs.hf_repo }}
          PRIVATE: ${{ inputs.private }}
          VERSION: ${{ inputs.version }}
          STAGE: ${{ runner.temp }}/stage
        run: |
          [ -n "$HF_TOKEN" ] || { echo "::error::the repository secret HF_TOKEN is not set"; exit 1; }
          python3 -m pip install --quiet huggingface_hub==0.36.0
          python3 - <<'EOF'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = os.environ["HF_REPO"]
          api.create_repo(repo, repo_type="model", private=os.environ["PRIVATE"] == "true", exist_ok=True)
          # v3b, the recommended model, lives on main. Other versions go to a
          # branch named after the version, so the model page keeps showing
          # the recommended one; the manifest pins the commit either way.
          version = os.environ["VERSION"]
          branch = "main" if version == "v3b" else version
          if branch != "main":
              api.create_branch(repo, repo_type="model", branch=branch, exist_ok=True)
          info = api.upload_folder(repo_id=repo, folder_path=os.environ["STAGE"], revision=branch,
                                   commit_message="guardspec-classifier " + version)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"Uploaded to https://huggingface.co/{repo}/tree/{branch}\n\n")
              f.write(f"revision: `{info.oid}`\n\nGATEWAY_FULL_L2_SOURCE: `{repo}@{info.oid}`\n")
          print(f"revision {info.oid}")
          EOF
