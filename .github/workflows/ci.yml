name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Built with the committed placeholder in web/dist: go build needs no
      # Node. The web job builds the control plane with the real UI.
      - run: go build ./...
      - run: go vet ./...
      - run: go vet -tags integration ./...
      - run: go test -race ./...

  onnx:
    name: Build and test with -tags onnx (cgo)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
      CGO_LDFLAGS: -L${{ github.workspace }}/.onnx/lib
      ONNXRUNTIME_LIB: ${{ github.workspace }}/.onnx/lib/libonnxruntime.so
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # ONNX Runtime + libtokenizers.a, pinned by SHA-256 in build/onnx-deps.sh.
      - run: make onnx-deps
      - run: go build -tags onnx ./...
      - run: go vet -tags onnx ./...
      # Models are not downloaded in CI: the model tests skip, the unit tests
      # and the runtime/tokenizer load test run against the real libraries.
      - run: go test -race -tags onnx ./internal/onnx/ ./internal/inference/... ./cmd/...
      # The model-layer eval baseline (L1+L2+L3). Our classifier is not
      # published, so this skips unless a runner provides models/.
      - name: Detector eval with model layers vs baseline
        run: |
          if [ -f models/cache/multilingual-e5-small/model.onnx ] && \
             { [ -f models/local/guardspec-classifier-v1/config.json ] || [ -f models/local/guardspec-classifier-v0/config.json ]; }; then
            go run -tags onnx ./cmd/eval -detector fusion-ml -baseline eval/baseline-onnx.json -max-regression 0.02
          else
            echo "models absent: skipping eval/baseline-onnx.json"
          fi

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_DB: guardspec
          POSTGRES_USER: ps
          # Throwaway credentials for an ephemeral CI container.
          POSTGRES_PASSWORD: ci-superuser-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ps -d guardspec"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: ps
      PGDATABASE: guardspec
      PGPASSWORD: ci-superuser-password
      GUARDSPEC_APP_PASSWORD: ci-app-password-0123456789
      TEST_DATABASE_URL: postgres://guardspec_app:ci-app-password-0123456789@localhost:5432/guardspec?sslmode=disable
      TEST_OWNER_DATABASE_URL: postgres://ps:ci-superuser-password@localhost:5432/guardspec?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Apply migrations
        run: |
          go run -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1 \
            -path migrations \
            -database "postgres://ps:${PGPASSWORD}@localhost:5432/guardspec?sslmode=disable" up
      - name: Set the application role password
        run: sh deploy/postgres/set-app-password.sh
      # Audit rows first: requests references organizations and projects
      # without ON DELETE CASCADE, which once broke the down step of 002.
      - name: Migrations roll back and forward
        run: |
          psql -v ON_ERROR_STOP=1 -q <<'SQL'
          INSERT INTO projects (id, org_id, name, slug) VALUES ('00000000-0000-0000-0000-0000000000aa', '00000000-0000-0000-0000-000000000001', 'ci', 'ci');
          INSERT INTO requests (org_id, action) VALUES ('00000000-0000-0000-0000-000000000001', 'allow');
          INSERT INTO requests (org_id, project_id, action) VALUES ('00000000-0000-0000-0000-000000000001', '00000000-0000-0000-0000-0000000000aa', 'block');
          SQL
          go run -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1 \
            -path migrations \
            -database "postgres://ps:${PGPASSWORD}@localhost:5432/guardspec?sslmode=disable" down -all
          go run -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1 \
            -path migrations \
            -database "postgres://ps:${PGPASSWORD}@localhost:5432/guardspec?sslmode=disable" up
          sh deploy/postgres/set-app-password.sh
      - run: go test -race -tags integration ./...

  licenses:
    name: Third-party licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Fails on GPL, AGPL, LGPL and unknown licenses (onnx build included).
      # Regenerate THIRD_PARTY_LICENSES.md with make licenses.
      - run: make licenses-check

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          # Report only what a change introduces; existing findings do not block.
          only-new-issues: true

  web:
    name: Admin UI (lint, types, unit, build, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Shipped dependencies must be MIT, Apache-2.0, BSD, ISC or 0BSD.
      - run: npm run licenses
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The control plane embeds the real build (web/embed.go) and serves it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o /dev/null ./cmd/control-plane/
        working-directory: .
      - run: go test ./cmd/control-plane/ -run 'TestUI'
        working-directory: .
      # The e2e tests run the build under the control plane's CSP, against a
      # mocked API (web/e2e/mockApi.ts): no backend needed.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  release-config:
    name: GoReleaser config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: check
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

  helm:
    name: Helm chart (lint, template, schema)
    runs-on: ubuntu-latest
    env:
      HELM_VERSION: v4.3.1
      HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      CHART: deploy/helm/guard-spec
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install helm and kubeconform (checksums pinned)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz -C "$RUNNER_TEMP/bin" --strip-components=1 linux-amd64/helm
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Default values, every optional part turned on (ci/), no models volume,
      # gateway-full (ci/), and the dbRoles job rendered for OpenShift.
      - run: helm lint "$CHART" --strict
      - run: helm lint "$CHART" --strict -f "$CHART/ci/all-options-values.yaml"
      - run: helm lint "$CHART" --strict -f "$CHART/ci/gateway-full-values.yaml"
      - name: Render and validate against the Kubernetes schema
        run: |
          kc() { kubeconform -strict -summary -kubernetes-version 1.33.0 -skip ServiceMonitor -; }
          helm template gs "$CHART" | kc
          helm template gs "$CHART" -f "$CHART/ci/all-options-values.yaml" | kc
          helm template gs "$CHART" --set models.persistence.enabled=false | kc
          helm template gs "$CHART" -f "$CHART/ci/gateway-full-values.yaml" | kc
          helm template gs "$CHART" -f "$CHART/ci/all-options-values.yaml" \
            --api-versions security.openshift.io/v1 | kc
      - name: No models volume without a claim (gateway-full keeps its models)
        run: |
          if helm template gs "$CHART" -f "$CHART/ci/gateway-full-values.yaml" | grep -q 'mountPath: /models'; then
            echo "a volume is mounted over /models without a models claim" >&2; exit 1
          fi
          helm template gs "$CHART" | grep -q 'mountPath: /models'

  terraform:
    name: Terraform AWS reference (fmt, validate, test)
    runs-on: ubuntu-latest
    env:
      TERRAFORM_VERSION: 1.17.1
      TERRAFORM_SHA256: 4638628058e71a55212b1c563712eac03b902128f40740f3dc8174df12135061
    defaults:
      run:
        working-directory: deploy/terraform/aws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install terraform (checksum pinned)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/terraform.zip" "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_SHA256}  $RUNNER_TEMP/terraform.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/terraform.zip" terraform -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: terraform fmt -check -diff -recursive
      # Providers come from the committed .terraform.lock.hcl (hashes checked).
      # No backend, no credentials: nothing touches an AWS account.
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
      # A plan against a mocked AWS provider (tests/plan.tftest.hcl).
      - run: terraform test
