name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go vet -tags integration ./...
      - run: go test -race ./...

  onnx:
    name: Build and test with -tags onnx (cgo)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
      CGO_LDFLAGS: -L${{ github.workspace }}/.onnx/lib
      ONNXRUNTIME_LIB: ${{ github.workspace }}/.onnx/lib/libonnxruntime.so
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # ONNX Runtime + libtokenizers.a, pinned by SHA-256 in build/onnx-deps.sh.
      - run: make onnx-deps
      - run: go build -tags onnx ./...
      - run: go vet -tags onnx ./...
      # Models are not downloaded in CI: the model tests skip, the unit tests
      # and the runtime/tokenizer load test run against the real libraries.
      - run: go test -race -tags onnx ./internal/onnx/ ./cmd/...

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: promptshield
          POSTGRES_USER: ps
          # Throwaway credentials for an ephemeral CI container.
          POSTGRES_PASSWORD: ci-superuser-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ps -d promptshield"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: ps
      PGDATABASE: promptshield
      PGPASSWORD: ci-superuser-password
      PS_APP_PASSWORD: ci-app-password-0123456789
      TEST_DATABASE_URL: postgres://ps_app:ci-app-password-0123456789@localhost:5432/promptshield?sslmode=disable
      TEST_OWNER_DATABASE_URL: postgres://ps:ci-superuser-password@localhost:5432/promptshield?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Apply migrations
        run: |
          go run -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1 \
            -path migrations \
            -database "postgres://ps:${PGPASSWORD}@localhost:5432/promptshield?sslmode=disable" up
      - name: Set the application role password
        run: sh deploy/postgres/set-app-password.sh
      - name: Migrations roll back and forward
        run: |
          go run -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1 \
            -path migrations \
            -database "postgres://ps:${PGPASSWORD}@localhost:5432/promptshield?sslmode=disable" down -all
          go run -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1 \
            -path migrations \
            -database "postgres://ps:${PGPASSWORD}@localhost:5432/promptshield?sslmode=disable" up
          sh deploy/postgres/set-app-password.sh
      - run: go test -race -tags integration ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          # Report only what a change introduces; existing findings do not block.
          only-new-issues: true

  release-config:
    name: GoReleaser config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: check
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
