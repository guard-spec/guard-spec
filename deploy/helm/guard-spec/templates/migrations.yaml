{{- if .Values.migrations.enabled }}
{{- $m := .Values.migrations }}
{{- $db := .Values.externalDatabase }}
# Applies migrations/ before every install and upgrade, like the compose
# migrate service; the dbRoles hook (weight 0) runs after it. The SQL files
# are copied from the gateway image, which carries those of its release.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "guard-spec.fullname" . }}-migrate
  labels:
    {{- include "guard-spec.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ $m.backoffLimit }}
  activeDeadlineSeconds: {{ $m.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "guard-spec.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: migrations-source
          image: {{ include "guard-spec.gatewayDerivedImage" (dict "root" . "image" $m.sourceImage) }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["/bin/sh", "-ec", "cp /app/migrations/*.sql /migrations/ && ls /migrations"]
          volumeMounts:
            - name: migrations
              mountPath: /migrations
          resources:
            {{- toYaml $m.resources | nindent 12 }}
      containers:
        - name: migrate
          image: {{ include "guard-spec.imageDigest" $m.image }}
          imagePullPolicy: {{ $m.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # No password in the URL: PGPASSWORD below.
          args:
            - -path=/migrations
            - -database=postgres://{{ $db.ownerUser }}@{{ $db.host }}:{{ $db.port }}/{{ $db.database }}?sslmode={{ $db.sslmode }}
            - up
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret is required" .Values.existingSecret }}
                  key: {{ $m.passwordKey | default "POSTGRES_PASSWORD" }}
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
          resources:
            {{- toYaml $m.resources | nindent 12 }}
      volumes:
        - name: migrations
          emptyDir: {}
{{- end }}
