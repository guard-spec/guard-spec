{{- if .Values.serviceAccount.create }}
# Neither service calls the Kubernetes API: the pods do not mount its token.
# The annotations bind a cloud identity (IRSA, GKE or AKS Workload Identity).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "guard-spec.serviceAccountName" . }}
  labels:
    {{- include "guard-spec.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
