{{- if .Values.networkPolicy.enabled }}
{{- $full := include "guard-spec.fullname" . }}
{{- $np := .Values.networkPolicy }}
{{- $ports := dict "gateway" (list 8080 .Values.gateway.metricsPort) "controlPlane" (list 8081 .Values.controlPlane.metricsPort) }}
{{- range $key, $component := dict "gateway" "gateway" "controlPlane" "control-plane" }}
{{- $p := get $ports $key }}
---
# Only the API port (from networkPolicy.{{ $key }}.from) and the metrics port
# (from networkPolicy.metrics.from) accept connections.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $full }}-{{ $component }}
  labels:
    {{- include "guard-spec.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  podSelector:
    matchLabels:
      {{- include "guard-spec.selector" (dict "root" $ "component" $component) | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $np.egress.restrict }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - {port: {{ index $p 0 }}, protocol: TCP}
      {{- with (get $np $key).from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - ports:
        - {port: {{ index $p 1 }}, protocol: TCP}
      {{- with $np.metrics.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $np.egress.restrict }}
  egress:
    # DNS
    - ports:
        - {port: {{ $np.egress.dnsPort }}, protocol: UDP}
        - {port: {{ $np.egress.dnsPort }}, protocol: TCP}
    # Postgres
    - ports:
        - {port: {{ $np.egress.database.port }}, protocol: TCP}
      {{- with $np.egress.database.to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with (get $np.egress $key) }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
