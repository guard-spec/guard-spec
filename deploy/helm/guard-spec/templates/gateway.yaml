{{- $name := printf "%s-gateway" (include "guard-spec.fullname" .) -}}
{{- $sel := dict "root" . "component" "gateway" -}}
{{- $models := include "guard-spec.modelsVolume" . -}}
{{- $claim := include "guard-spec.modelsClaimUsed" . -}}
{{- $pull := .Values.models.pull -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "guard-spec.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  {{- if not .Values.gateway.autoscaling.enabled }}
  replicas: {{ .Values.gateway.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "guard-spec.selector" $sel | nindent 6 }}
  template:
    metadata:
      {{- include "guard-spec.podMetadata" $sel | nindent 6 }}
    spec:
      {{- with include "guard-spec.serviceAccountName" . }}
      serviceAccountName: {{ . }}
      {{- end }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if $pull.enabled }}
      initContainers:
        # ./models pull: downloads the models of the image's manifest.yaml
        # into /models/cache, verifying every SHA-256; a no-op when present.
        - name: models-pull
          image: {{ include "guard-spec.gatewayDerivedImage" (dict "root" . "image" $pull.image) }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # models init (the image has no shell): MODELS_REQUIRED=true makes a
          # failed pull fatal; otherwise it warns and the gateway starts on the
          # layers it can load (see /readyz).
          command:
            - ./models
            - init
            - -manifest
            - manifest.yaml
            - -dir
            - /models/cache
            {{- range $pull.models }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: HOME
              value: /tmp
            - name: MODELS_REQUIRED
              value: {{ $pull.required | toString | quote }}
            - name: MODELS_MIRROR
              value: {{ $pull.mirror | quote }}
            {{- if $pull.hfToken.secretName }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $pull.hfToken.secretName }}
                  key: {{ $pull.hfToken.key | default "HF_TOKEN" }}
            {{- end }}
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml $pull.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "guard-spec.image" (dict "root" . "image" .Values.gateway.image) }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: {{ .Values.gateway.metricsPort }}
            {{- if .Values.gateway.adminListener.enabled }}
            - name: admin
              containerPort: {{ .Values.gateway.adminListener.port }}
            {{- end }}
          env:
            {{- include "guard-spec.commonEnv" . | nindent 12 }}
            - name: LISTEN_ADDR
              value: ":8080"
            - name: METRICS_ADDR
              value: {{ printf ":%v" .Values.gateway.metricsPort | quote }}
            {{- if $models }}
            - name: MODELS_PATH
              value: /models
            {{- end }}
            {{- with .Values.gateway.shadow }}
            {{- if or .model .modelDir }}
            {{- if .model }}
            - name: SHADOW_L2_MODEL
              value: {{ .model | quote }}
            {{- end }}
            {{- if .modelDir }}
            - name: SHADOW_L2_MODEL_DIR
              value: {{ .modelDir | quote }}
            {{- end }}
            - name: SHADOW_SAMPLE
              value: {{ .sample | toString | quote }}
            - name: SHADOW_TIMEOUT
              value: {{ .timeout | quote }}
            {{- if .maxInflight }}
            - name: SHADOW_MAX_INFLIGHT
              value: {{ .maxInflight | toString | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.gateway.modelsManifest }}
            - name: MODELS_MANIFEST
              value: {{ .Values.gateway.modelsManifest | quote }}
            {{- end }}
            # Optional: without CONTENT_KEK in the Secret the variable is not
            # set; stored content is then kept in the clear (docs/security).
            - name: CONTENT_KEK
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: CONTENT_KEK
                  optional: true
            {{- if .Values.gateway.adminToken.enabled }}
            - name: GATEWAY_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.gateway.adminToken.key }}
            {{- end }}
            {{- with .Values.gateway.scanCache }}
            {{- if not (has .backend (list "memory" "redis" "postgres")) }}
            {{- fail "gateway.scanCache.backend must be memory, redis or postgres" }}
            {{- end }}
            - name: SCAN_CACHE_SIZE
              value: {{ .size | toString | quote }}
            - name: SCAN_CACHE_BACKEND
              value: {{ .backend | quote }}
            {{- if ne .backend "memory" }}
            - name: SCAN_CACHE_TIMEOUT
              value: {{ .timeout | quote }}
            {{- end }}
            {{- if eq .backend "redis" }}
            - name: SCAN_CACHE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .redis.existingSecret | default $.Values.existingSecret }}
                  key: {{ .redis.key }}
            {{- end }}
            {{- end }}
            {{- with .Values.gateway.adminListener }}
            {{- if .enabled }}
            {{- if not .tlsSecret }}
            {{- fail "gateway.adminListener.enabled needs gateway.adminListener.tlsSecret (tls.crt, tls.key, ca.crt)" }}
            {{- end }}
            # The admin listener: /readyz and /admin over mutual TLS.
            - name: ADMIN_LISTEN_ADDR
              value: {{ printf ":%v" .port | quote }}
            - name: ADMIN_TLS_CERT_FILE
              value: /run/guard-spec/admin-tls/tls.crt
            - name: ADMIN_TLS_KEY_FILE
              value: /run/guard-spec/admin-tls/tls.key
            - name: ADMIN_TLS_CLIENT_CA_FILE
              value: /run/guard-spec/admin-tls/ca.crt
            {{- end }}
            {{- end }}
            {{- range $k, $v := .Values.gateway.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- with .Values.gateway.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if $models }}
            - name: models
              mountPath: /models
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
            {{- if .Values.gateway.adminListener.enabled }}
            - name: admin-tls
              mountPath: /run/guard-spec/admin-tls
              readOnly: true
            {{- end }}
            {{- with .Values.gateway.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      volumes:
        {{- if $claim }}
        - name: models
          persistentVolumeClaim:
            claimName: {{ include "guard-spec.modelsClaim" . }}
            {{- if not $pull.enabled }}
            readOnly: true
            {{- end }}
        {{- else if $models }}
        - name: models
          emptyDir:
            sizeLimit: {{ $pull.emptyDirSizeLimit }}
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.gateway.adminListener.enabled }}
        - name: admin-tls
          secret:
            secretName: {{ .Values.gateway.adminListener.tlsSecret }}
        {{- end }}
        {{- with .Values.gateway.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.gateway.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- include "guard-spec.topologySpread" (dict "root" $ "component" "gateway" "constraints" .) | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "guard-spec.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    {{- include "guard-spec.selector" $sel | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
---
# Metrics have their own ClusterIP Service, so exposing the API Service (for
# example as a LoadBalancer) never exposes /metrics.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-metrics
  labels:
    {{- include "guard-spec.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
    guard-spec.io/metrics: "true"
spec:
  type: ClusterIP
  selector:
    {{- include "guard-spec.selector" $sel | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.gateway.metricsPort }}
      targetPort: metrics
{{- if .Values.gateway.adminListener.enabled }}
---
# The admin listener (mutual TLS): ClusterIP only, never with the API Service.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "guard-spec.fullname" . }}-gateway-admin
  labels:
    {{- include "guard-spec.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    {{- include "guard-spec.selector" (dict "root" . "component" "gateway") | nindent 4 }}
  ports:
    - name: admin
      port: {{ .Values.gateway.adminListener.port }}
      targetPort: admin
{{- end }}
