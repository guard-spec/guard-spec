# Reference values for Amazon EKS. NOT VERIFIED on EKS: CI renders them and
# validates the result against the Kubernetes schema only. Adjust every
# <placeholder> and review before use.
#
#   helm install gs deploy/helm/guard-spec -n guard-spec \
#     -f deploy/helm/guard-spec/examples/values-eks.yaml
#
# Assumes: Amazon RDS for PostgreSQL (a server of its own, see values.yaml),
# the AWS Load Balancer Controller, the EBS CSI driver, a VPC CNI with
# network policy enforcement turned on, metrics-server for the autoscaler,
# and the Secret guard-spec-secrets (README, "Kubernetes"; or External
# Secrets from AWS Secrets Manager, docs/airgapped.md).

externalDatabase:
  url: postgres://guardspec_app@<db>.<id>.<region>.rds.amazonaws.com:5432/guardspec?sslmode=verify-full
  host: <db>.<id>.<region>.rds.amazonaws.com
  port: 5432
  database: guardspec
  ownerUser: guardspec_owner
  sslmode: verify-full

# Apply migrations/ and set the guardspec_app password on every install and upgrade.
migrations:
  enabled: true
dbRoles:
  enabled: true

# IRSA: the IAM role the pods assume, for example to read models from S3
# through a mirror or to reach Bedrock-backed upstreams.
serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/guard-spec

gateway:
  env:
    UPSTREAM_LLM_URL: https://api.openai.com/v1
  extraEnvFrom:
    - secretRef: {name: guard-spec-upstream}   # UPSTREAM_LLM_KEY
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
  podDisruptionBudget:
    enabled: true

controlPlane:
  replicaCount: 2
  env:
    PUBLIC_BASE_URL: https://guard.example.com
    ALLOWED_ORIGINS: https://guard.example.com
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
  podDisruptionBudget:
    enabled: true

# Each pod pulls the models into its own emptyDir: no ReadWriteMany volume
# is needed for several replicas across zones. MODELS_MIRROR can point at an
# S3 bucket behind CloudFront or a VPC endpoint (docs/airgapped.md).
models:
  persistence:
    enabled: false
  pull:
    enabled: true
    required: true

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:<region>:<account-id>:certificate/<id>
    alb.ingress.kubernetes.io/healthcheck-path: /health
    # Streaming responses.
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
  hosts:
    - host: llm.example.com
      service: gateway
    - host: guard.example.com
      service: controlPlane

networkPolicy:
  enabled: true
  egress:
    restrict: true
    database:
      to:
        - ipBlock: {cidr: <rds-subnet-cidr>}
