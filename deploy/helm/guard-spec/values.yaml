# Guard Spec. Postgres is external: run the migrations against it before
# installing, or let the chart do it (migrations.enabled below; README,
# "Kubernetes").
#
# Every part added on top of the two Deployments (migrations, dbRoles, model
# pull, ingress, route, autoscaling, disruption budgets, network policies,
# service account) is off by default. examples/ holds reference values for
# EKS, AKS, GKE and OpenShift.

# Set GUARD_ENV=dev only for a throwaway cluster. Any other value makes the
# services refuse missing, default or weak secrets.
guardEnv: ""

# Secrets. The chart never stores them in values by default: create a Secret
# with these keys and name it here.
#   POSTGRES_PASSWORD  superuser, used only by the optional dbRoles job
#   GUARDSPEC_APP_PASSWORD  application role guardspec_app (both services);
#                           the key name is appPasswordKey
#   JWT_SECRET         control plane signing key, at least 32 bytes
#   MFA_ENC_KEY        control plane, encrypts TOTP secrets: 32 random bytes in
#                      base64 (openssl rand -base64 32). Optional here: it may
#                      also come from controlPlane.extraEnvFrom. Without it 2FA
#                      cannot be turned on. Back it up with the database.
#   CONTENT_KEK        gateway and control plane, encrypts stored content
#                      (AUDIT_STORE_CONTENT or an org's opt-in): 32 random bytes
#                      in base64, several comma-separated for a rotation.
#                      Optional; for Vault Transit set CONTENT_KEK_VAULT_KEY,
#                      VAULT_ADDR and VAULT_TOKEN_FILE through env/extraEnvFrom.
#                      Back it up with the database.
#   AUDIT_SIGNING_KEY  control plane, signs the activity log's hash chains:
#                      an Ed25519 seed, 32 random bytes in base64. Optional.
#   ADMIN_PASSWORD     first owner (optional; with controlPlane.adminEmail)
#   GATEWAY_ADMIN_TOKEN gateway, bearer token of POST /admin/models/reload
#                      (only with gateway.adminToken.enabled; 32+ bytes)
# kubectl create secret generic guard-spec-secrets \
#   --from-literal=POSTGRES_PASSWORD=... --from-literal=GUARDSPEC_APP_PASSWORD=... \
#   --from-literal=JWT_SECRET=... --from-literal=ADMIN_PASSWORD=... \
#   --from-literal=MFA_ENC_KEY="$(openssl rand -base64 32)"
existingSecret: guard-spec-secrets
# Key of the application role password in existingSecret.
appPasswordKey: GUARDSPEC_APP_PASSWORD

# External Postgres. URLs carry no password: GUARDSPEC_APP_PASSWORD reaches
# the services as PGPASSWORD. Use sslmode=require or stronger outside a test cluster.
# Migration 004 runs CREATE ROLE guardspec_app, and roles are cluster-wide in
# Postgres: on a server shared with other databases (or another installation)
# where the role already exists, the migration fails. Use a server of its own.
externalDatabase:
  # Application role (guardspec_app), used by the gateway and the control plane.
  url: postgres://guardspec_app@postgres:5432/guardspec?sslmode=require
  # libpq settings for the optional dbRoles job, which connects as the owner.
  host: postgres
  port: 5432
  database: guardspec
  ownerUser: ps
  sslmode: require

# Optional hook job that applies migrations/ to the database before every
# install and upgrade (helm.sh/hook pre-install,pre-upgrade, before dbRoles),
# as the compose migrate service does. It connects as externalDatabase.ownerUser
# with POSTGRES_PASSWORD from existingSecret. Off: run the migrations yourself
# (README, "Kubernetes"); the services never migrate at startup.
migrations:
  enabled: false
  # golang-migrate, the tool the compose file and CI use.
  image:
    repository: migrate/migrate
    tag: v4.20.1
    # Pinned for the default tag; empty it when you change the tag, or set
    # the digest of your mirrored copy.
    digest: sha256:76cc2074cb6642631f34a898ced71e6aeaa6b1a4d78c4daa743275a22e0c5be7
    pullPolicy: IfNotPresent
  # The SQL files come from the gateway image (/app/migrations), copied by an
  # init container, so they always match the release being installed.
  # Empty: gateway.image.
  sourceImage:
    repository: ""
    tag: ""
  # Key of the owner password in existingSecret.
  passwordKey: POSTGRES_PASSWORD
  backoffLimit: 3
  activeDeadlineSeconds: 600
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

# Optional hook job that sets the guardspec_app password from
# GUARDSPEC_APP_PASSWORD, as the compose db-roles service does. Run the
# migrations first (migrations.enabled runs them in an earlier hook).
dbRoles:
  enabled: false
  image:
    repository: postgres
    tag: 17.11-alpine
    pullPolicy: IfNotPresent
  # Pod securityContext of the job; the container uses securityContext below.
  # Without runAsUser here the chart adds runAsUser: 70 (the postgres user of
  # the alpine image, which otherwise runs as root), except on OpenShift
  # (the cluster serves security.openshift.io/v1), where the SCC assigns a UID
  # from the namespace range. With helm template, pass
  # --api-versions security.openshift.io/v1 to render for OpenShift.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

imagePullSecrets: []

# Service account of the gateway and control plane pods. Off: they run as the
# namespace's default account. Neither service calls the Kubernetes API, so
# the API token is never mounted; the annotations bind cloud identities,
# whose webhooks inject their own tokens:
#   EKS (IRSA):            eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/<role>
#   GKE Workload Identity: iam.gke.io/gcp-service-account: <gsa>@<project>.iam.gserviceaccount.com
#   AKS Workload Identity: azure.workload.identity/client-id: <client-id>
#                          (plus podLabels azure.workload.identity/use: "true")
serviceAccount:
  create: false
  # Name to create, or an existing account to use when create is false.
  # Empty with create: the release full name.
  name: ""
  annotations: {}

# Extra labels and annotations on the gateway and control plane pods.
podLabels: {}
podAnnotations: {}

# Shared pod and container security settings: non-root, read-only root
# filesystem, no privilege escalation, no capabilities.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

gateway:
  replicaCount: 2
  image:
    repository: ghcr.io/guard-spec/guard-spec-gateway
    tag: ""  # defaults to the chart appVersion
    pullPolicy: IfNotPresent
    # true: the image has a shell (the released 0.3.x images), so the models
    # and migrations init containers run small scripts. false: images built
    # from this checkout, which have no shell; the init containers use the
    # binaries' own subcommands (models init, doctor copy-migrations).
    shell: true
  service:
    type: ClusterIP
    port: 8080
  metricsPort: 9090
  # Extra environment, such as UPSTREAM_LLM_URL, OUTPUT_*, SCAN_ROLES.
  # Secrets (UPSTREAM_LLM_KEY, and UPSTREAM_KEY_* for named upstreams) belong
  # in extraEnvFrom.
  env:
    UPSTREAM_LLM_URL: ""
    # Routing: which orgs may use which UPSTREAM_KEY_* variable, as
    # "UPSTREAM_KEY_MAIN=*;UPSTREAM_KEY_ACME=<org-id>". Empty: no org may name
    # a key. Set the same value on the control plane.
    UPSTREAM_KEY_ORGS: ""
    # "true" lets org-defined upstreams reach loopback, private and CGNAT
    # addresses (the cluster network). Keep "false" unless org admins are trusted.
    UPSTREAM_ALLOW_PRIVATE: "false"
    AUDIT_STORE_CONTENT: "false"
    # Per-key limits for keys without their own; 0 = unlimited. Counted per
    # replica: N replicas allow up to N times the limit.
    RATE_LIMIT_RPM: "0"
    RATE_LIMIT_TPM: "0"
    METRICS_TENANT_LABELS: "false"
    # Tracing is on only when set (OTLP/HTTP, e.g. http://otel-collector:4318).
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
    OTEL_PROPAGATE_UPSTREAM: "false"
    # Alert events (docs/alerts.md): an allowed request scoring at least this
    # emits detection.flagged; ALERTS_EVENTS "off" emits no events at all.
    ALERTS_FLAG_THRESHOLD: "0.5"
    ALERTS_EVENTS: ""
  extraEnvFrom: []
  # Shadow mode (README, "Shadow mode and model reload"): a candidate L2
  # classifier scores the same traffic off the response path and only records
  # what it would have decided. Off while model and modelDir are empty. The
  # candidate must be in the models volume (models.pull.models), and it costs
  # about one more classifier in memory and CPU for sampled requests.
  shadow:
    model: ""        # name@version, e.g. guardspec-classifier@v3b
    modelDir: ""     # a directory under /models; wins over model
    sample: "1"      # share of requests compared, 0 to 1
    timeout: "2s"    # budget of one request's comparison
    maxInflight: ""  # concurrent candidate runs; empty: CPUs / 2
  # Manifest file (MODELS_MANIFEST) for reloads and /readyz, for example on
  # the models volume. Empty: the manifest built into the image.
  modelsManifest: ""
  # POST /admin/models/reload and GET /admin/models (hot reload without a
  # restart). Off unless enabled; the token is read from existingSecret.
  # SIGHUP reloads without it. Each replica reloads on its own.
  adminToken:
    enabled: false
    key: GATEWAY_ADMIN_TOKEN
  # Scan cache (README, "Scan cache"): detector results of texts a session
  # sends again (system prompt, tools, earlier tool results), kept for 6 hours
  # as scores and hashes, never text. Each replica has its own in-memory
  # cache (size entries; 0 turns every layer off). With more than one replica,
  # a shared backend lets a session go on when its next turn lands on another
  # replica or after a restart, instead of classifying its whole history
  # again (and getting 413 past 1 MiB):
  #   memory:   this replica only (the default)
  #   postgres: the scan_cache table of the gateway's database (migration 020)
  #   redis:    a Redis the chart does not install; its URL
  #             (rediss://:<password>@host:6379/0) comes from a secret. Keep it
  #             private and authenticated: whoever can write to it can mark
  #             content as clean (docs/security/README.md).
  # A slow or failing backend is skipped after timeout: the request is
  # scanned as without it. With networkPolicy.egress.restrict, allow the Redis
  # port in networkPolicy.egress.gateway.
  scanCache:
    size: "4096"
    backend: memory
    timeout: "50ms"
    redis:
      # Secret holding the URL; empty: existingSecret.
      existingSecret: ""
      key: SCAN_CACHE_REDIS_URL
  # With L1 + L2 + L3 loaded the gateway uses about 900 MiB right after
  # start; the limit leaves headroom for requests. L1 only needs much less.
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {memory: 2Gi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Spread replicas over nodes or zones. A constraint without labelSelector
  # gets the gateway's pod labels. Example:
  #   - maxSkew: 1
  #     topologyKey: topology.kubernetes.io/zone
  #     whenUnsatisfiable: ScheduleAnyway
  topologySpreadConstraints: []
  # HorizontalPodAutoscaler (autoscaling/v2). Enabled: the Deployment leaves
  # the replica count to it. Rate limits are counted per replica.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    # Empty: no memory target.
    targetMemoryUtilizationPercentage: ""
    behavior: {}
  # PodDisruptionBudget (policy/v1): minAvailable, or maxUnavailable when set.
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
    maxUnavailable: ""

controlPlane:
  replicaCount: 1
  image:
    repository: ghcr.io/guard-spec/guard-spec-control-plane
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081
  metricsPort: 9091
  # The first owner is created when adminEmail is set and ADMIN_PASSWORD is in
  # the Secret.
  adminEmail: ""
  # GATEWAY_URL: where the admin UI's Models page reads the gateway's /readyz
  # (server side; no Internet). Empty: this release's gateway Service. "-":
  # not set, and the page says it is not configured.
  gatewayURL: ""
  env:
    ALLOWED_ORIGINS: ""
    # Same as gateway.env.UPSTREAM_KEY_ORGS; checked when upstreams are saved.
    UPSTREAM_KEY_ORGS: ""
    # Audit rows older than this are deleted; 0 keeps them forever. Safe with
    # several replicas (advisory lock).
    AUDIT_RETENTION_DAYS: "90"
    # The same job deletes activity log rows older than this (0 keeps them
    # forever) ...
    ACTIVITY_LOG_RETENTION_DAYS: "365"
    # ... and sessions revoked or expired more than this many days ago.
    # Active sessions are never deleted; 0 keeps them forever.
    SESSION_RETENTION_DAYS: "30"
    # Origin of the admin UI (https://guard.example.com): SSO callbacks, and
    # links in notifications and confirmation emails.
    PUBLIC_BASE_URL: ""
    # Alerts (docs/alerts.md §9). Which orgs may name which channel secret, as
    # "WEBHOOK_SECRET_SIEM=webhook:*;A2A_SOC=a2a:<org-id>". Empty: none.
    ALERTS_SECRET_ORGS: ""
    # Org ids whose allow_private channels may reach private addresses.
    ALERTS_PRIVATE_ORGS: ""
    ALERTS_EMAIL_DAILY_CAP: "500"
    ALERTS_LANG: "en"
    TELEGRAM_BOT_USERNAME: ""
    # "1" long-polls Telegram instead of the webhook (no public URL needed).
    TELEGRAM_POLLING: ""
    SMTP_FROM: ""
  # Secrets go in extraEnvFrom, for example a Secret "guard-spec-alerts" with
  # MFA_ENC_KEY, SMTP_URL, TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET,
  # SLACK_BOT_TOKEN and the channel secrets listed in ALERTS_SECRET_ORGS:
  #   extraEnvFrom:
  #     - secretRef: {name: guard-spec-alerts}
  extraEnvFrom: []
  resources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {memory: 256Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # As for the gateway.
  topologySpreadConstraints: []
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: ""
    behavior: {}
  # With one replica, minAvailable: 1 blocks node drains: raise replicaCount
  # (or enable autoscaling) first.
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
    maxUnavailable: ""

# Detection models for the gateway, mounted read-only at /models when a claim
# is used (existingClaim, or persistence.enabled). Fill the volume with
# models.pull below, the image's ./models tool or your own job.
#
# Without either, nothing is mounted at /models (unless models.pull is on):
# - guard-spec-gateway-full (models inside the image) runs L1 + L2 + L3:
#     --set gateway.image.repository=ghcr.io/guard-spec/guard-spec-gateway-full
#     --set models.persistence.enabled=false
# - the plain gateway image runs L1 only; /readyz reports "degraded":true
#   and stays ready.
#
# A ReadWriteOnce claim is mounted by pods of one node only: with gateway
# replicas on several nodes use ReadWriteMany, or no claim and models.pull
# (each pod fills an emptyDir of its own).
models:
  # Use an existing PersistentVolumeClaim.
  existingClaim: ""
  # Otherwise create one when enabled. Disabled: no models volume.
  persistence:
    enabled: true
    storageClass: ""
    accessModes: [ReadWriteOnce]
    size: 5Gi
  # Init container that runs `./models pull` (the gateway image's tool and
  # manifest.yaml) before the gateway starts: it downloads the recommended
  # version of every non-optional model from the mirror or Hugging Face into
  # /models/cache/<name>/<version>/, checks every file against the SHA-256
  # pinned in the manifest, and does nothing when the files are there and
  # verified. Without a claim the models go to an emptyDir of the pod. Not
  # needed with gateway-full (models inside the image).
  pull:
    enabled: false
    # Model references (name or name@version). Empty: the recommended ones.
    models: []
    # Base URL tried before Hugging Face, laid out as
    # <mirror>/<name>/<version>/<file> (MODELS_MIRROR; docs/airgapped.md).
    mirror: ""
    # Optional Secret key holding HF_TOKEN, for gated optional models.
    hfToken:
      secretName: ""
      key: HF_TOKEN
    # true: the pod does not start when a model cannot be pulled. false: the
    # gateway starts on the layers it can load (L1 at least), like compose.
    required: false
    # Image with the models tool and manifest.yaml. Empty: gateway.image.
    image:
      repository: ""
      tag: ""
    # Size limit of the emptyDir used when there is no claim.
    emptyDirSizeLimit: 2Gi
    resources:
      requests: {cpu: 100m, memory: 64Mi}
      limits: {memory: 256Mi}

# Ingress (networking.k8s.io/v1) to the gateway and/or the control plane.
# Each host names the Service it routes to: gateway or controlPlane. LLM
# responses can stream for minutes: raise the controller's read timeout (for
# ingress-nginx: nginx.ingress.kubernetes.io/proxy-read-timeout: "300").
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  #  - host: llm.example.com
  #    service: gateway
  #    paths: [{path: /, pathType: Prefix}]   # the default
  #  - host: guard.example.com
  #    service: controlPlane
  tls: []
  #  - secretName: guard-spec-tls
  #    hosts: [llm.example.com, guard.example.com]

# OpenShift Routes (route.openshift.io/v1), instead of or next to the
# Ingress. An empty host lets the router pick one.
route:
  enabled: false
  annotations:
    # Streaming LLM responses outlast the router's 30s default.
    haproxy.router.openshift.io/timeout: 5m
  gateway:
    enabled: true
    host: ""
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
  controlPlane:
    enabled: true
    host: ""
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect

# NetworkPolicies for the gateway and control plane pods (the hook jobs are
# not selected). Ingress: only the API and metrics ports are open, to the
# sources listed (NetworkPolicyPeer lists; empty: any source).
networkPolicy:
  enabled: false
  gateway:
    from: []
  controlPlane:
    from: []
  # Who may scrape the metrics ports, for example:
  #   - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
  metrics:
    from: []
  egress:
    # false: outbound traffic is not restricted. true: only DNS, the
    # database and the rules below.
    restrict: false
    dnsPort: 53
    database:
      port: 5432
      # Empty: any destination on that port. Example: [{ipBlock: {cidr: 10.0.8.0/24}}]
      to: []
    # Extra NetworkPolicyEgressRules. The defaults allow HTTPS anywhere:
    # upstream LLM APIs and the model pull (gateway); SSO, webhooks, Slack,
    # Telegram (control plane). Add the OTLP collector, SMTP or an in-cluster
    # LLM here.
    gateway:
      - ports: [{port: 443, protocol: TCP}]
    controlPlane:
      - ports: [{port: 443, protocol: TCP}]

# Prometheus Operator ServiceMonitor for both metrics Services.
serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}
