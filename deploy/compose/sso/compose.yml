#
# SSO TEST ENVIRONMENT ONLY. Adds a Keycloak identity provider to the
# development stack, for the SAML 2.0, OIDC and SCIM end-to-end checks of
# scripts/sso-e2e.sh (`make sso-e2e`). Never deploy it.
#
# It is an extra compose file on top of the repository's two, run from the
# repository root:
#
#   docker compose -p gs-sso-e2e \
#     -f docker-compose.yml -f docker-compose.override.yml \
#     -f deploy/compose/sso/compose.yml up -d control-plane keycloak keycloak-loopback
#
# scripts/sso-e2e.sh does that with its own ports and generated test
# secrets, then removes the project again.
#
# Keycloak imports realm-guardspec-test.json at start: the realm
# guardspec-test with test users and groups (see that file). The SAML and
# OIDC clients for Guard Spec are not in the import: their ids contain the
# Guard Spec provider id, which exists only once the provider is created, so
# the script creates them with Keycloak's admin REST API.
#
# Host names. Guard Spec accepts an http issuer or SSO URL only on loopback
# (localhost), so Keycloak's public URL is http://localhost:${KEYCLOAK_PORT}
# (KC_HOSTNAME). The browser (curl on the host) reaches it on the published
# port. The control plane fetches the OIDC discovery document, keys and
# tokens from the same URL: keycloak-loopback shares the control plane's
# network namespace and forwards its localhost:${KEYCLOAK_PORT} to Keycloak.

services:
  # The image built from this checkout, under its own tag so that the
  # guard-spec-control-plane:latest of other local stacks is left alone.
  control-plane:
    image: guard-spec-control-plane:sso-e2e
    environment:
      # Client secret of the Keycloak OIDC client (test value, generated by
      # scripts/sso-e2e.sh); the OIDC provider names this variable.
      OIDC_SECRET_KEYCLOAK: ${OIDC_SECRET_KEYCLOAK:-}

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2@sha256:3617b09bb4b7510a8d8d9b9fc5707399e2d70688dbcc2f8fb013a144829be1b9
    # Development mode: in-memory H2 database, plain http. Test only.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      # Required; scripts/sso-e2e.sh generates a throwaway one.
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-28180}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-28180}:8080"
    volumes:
      - ./deploy/compose/sso/realm-guardspec-test.json:/opt/keycloak/data/import/realm-guardspec-test.json:ro

  # localhost:${KEYCLOAK_PORT} inside the control plane's network namespace,
  # forwarded to Keycloak (see the host names note above).
  keycloak-loopback:
    image: caddy:2.11.9-alpine@sha256:71d41fe4b1ae92a058abc87afe614178b996d8a6b96d0f4c71ae30606e5927e3
    network_mode: service:control-plane
    command: ["caddy", "reverse-proxy", "--from", ":${KEYCLOAK_PORT:-28180}", "--to", "keycloak:8080"]
    depends_on:
      - control-plane
      - keycloak
