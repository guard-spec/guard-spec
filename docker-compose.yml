# Secrets have no defaults here. Production: copy .env.example to .env, fill it
# in, and run `docker compose -f docker-compose.yml up -d` (so that the dev
# override is not loaded). The services refuse to start with missing, default
# or weak secrets unless GUARD_ENV=dev, which docker-compose.override.yml sets.

services:
  gateway:
    image: promptshield/gateway:latest
    build:
      context: .
      dockerfile: build/gateway.Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8080"   # proxy API (OpenAI-compatible)
      - "${METRICS_PORT:-9090}:9090"   # Prometheus metrics
    environment:
      GUARD_ENV: ${GUARD_ENV:-}
      # The password comes from PGPASSWORD so that it is never part of a URL here.
      DATABASE_URL: postgres://ps_app@postgres:5432/promptshield?sslmode=disable
      PGPASSWORD: ${PS_APP_PASSWORD:-}
      # Audit rows keep hashes and lengths only; true also stores the content.
      AUDIT_STORE_CONTENT: ${AUDIT_STORE_CONTENT:-false}
      CLICKHOUSE_URL: clickhouse://clickhouse:9000/promptshield
      MODELS_PATH: /models
      # internal/onnx: bound on concurrent model runs (default: CPU count) and
      # ORT threads per run (default: ORT picks). ONNXRUNTIME_LIB is set in the image.
      INFERENCE_MAX_CONCURRENCY: ${INFERENCE_MAX_CONCURRENCY:-}
      INFERENCE_INTRA_OP_THREADS: ${INFERENCE_INTRA_OP_THREADS:-}
      CONTROL_PLANE_URL: http://control-plane:8081
      LOG_LEVEL: info
      # Base URL of an OpenAI-compatible API, such as http://host.docker.internal:11434/v1.
      # Leave empty for stub responses.
      UPSTREAM_LLM_URL: ${UPSTREAM_LLM_URL:-}
      UPSTREAM_LLM_KEY: ${UPSTREAM_LLM_KEY:-}
      UPSTREAM_LLM_TIMEOUT: ${UPSTREAM_LLM_TIMEOUT:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - models:/models
    depends_on:
      postgres:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  control-plane:
    image: promptshield/control-plane:latest
    build:
      context: .
      dockerfile: build/control-plane.Dockerfile
    ports:
      - "${CONTROL_PLANE_PORT:-18081}:8081"
    environment:
      GUARD_ENV: ${GUARD_ENV:-}
      DATABASE_URL: postgres://ps_app@postgres:5432/promptshield?sslmode=disable
      PGPASSWORD: ${PS_APP_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      # The first owner is created only when both are set.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: info
    depends_on:
      db-roles:
        condition: service_completed_successfully

  migrate:
    image: migrate/migrate:v4.17.1@sha256:de154de4b7f9d0d751aacb1ec6023f5fc96f874eb88b65d050f761a33376aa4b
    command:
      - -path=/migrations
      - -database=postgres://ps@postgres:5432/promptshield?sslmode=disable
      - up
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Sets the ps_app password from PS_APP_PASSWORD after migrating, and refuses
  # default or weak database passwords unless GUARD_ENV=dev.
  db-roles:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    entrypoint: ["/bin/sh", "/set-app-password.sh"]
    environment:
      GUARD_ENV: ${GUARD_ENV:-}
      PGHOST: postgres
      PGUSER: ps
      PGDATABASE: promptshield
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      PS_APP_PASSWORD: ${PS_APP_PASSWORD:-}
    volumes:
      - ./deploy/postgres/set-app-password.sh:/set-app-password.sh:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # web/ is not in the repository yet: docker compose --profile ui up
  ui:
    profiles: [ui]
    image: promptshield/ui:latest
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:18081
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:8080

  postgres:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: promptshield
      POSTGRES_USER: ps
      # Required on first start; the image refuses an empty one.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ps -d promptshield"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Not used by the services yet: docker compose --profile analytics up
  clickhouse:
    profiles: [analytics]
    image: clickhouse/clickhouse-server:24-alpine
    volumes:
      - chdata:/var/lib/clickhouse
    ports:
      - "8123:8123"   # HTTP interface (optional, for debugging)

  # The gateway does not load models yet: docker compose --profile models up model-init
  model-init:
    profiles: [models]
    image: promptshield/model-init:latest
    build:
      context: .
      dockerfile: build/model-init.Dockerfile
    command:
      - --models
      - qwen3guard-gen-0.6b,protectai-deberta-v3-xsmall-pi
      - --output
      - /models
    environment:
      HF_TOKEN: ${HF_TOKEN:-}   # optional for public models
    volumes:
      - models:/models
    restart: "no"

  # Pulls the ONNX models in models/manifest.yaml into the models volume,
  # verifying SHA-256: docker compose --profile models run --rm models-pull
  models-pull:
    profiles: [models]
    image: promptshield/gateway:latest
    build:
      context: .
      dockerfile: build/gateway.Dockerfile
    entrypoint: ["./models", "pull", "-manifest", "manifest.yaml", "-dir", "/models"]
    user: "0:0"   # the named volume is owned by root
    environment:
      HF_TOKEN: ${HF_TOKEN:-}   # needed for gated repos (protectai small v2)
    volumes:
      - models:/models
    restart: "no"

volumes:
  models:
  pgdata:
  chdata:
