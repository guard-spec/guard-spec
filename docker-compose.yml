# Secrets have no defaults here. Production: copy .env.example to .env, fill it
# in, and run `docker compose -f docker-compose.yml up -d` (so that the dev
# override is not loaded). The services refuse to start with missing, default
# or weak secrets unless GUARD_ENV=dev, which docker-compose.override.yml sets.
#
# Upgrading from PromptShield (the former name): the project name, the default
# database name and the application role changed. To keep an existing stack's
# volumes, set COMPOSE_PROJECT_NAME to the old project name (the directory name
# by default) and POSTGRES_DB=promptshield in .env; migration 010 renames the
# role ps_app to guardspec_app. See README, "Upgrading from PromptShield".

# Default project name; -p or COMPOSE_PROJECT_NAME override it.
name: guard-spec

services:
  gateway:
    image: guard-spec-gateway:latest
    build:
      context: .
      dockerfile: build/gateway.Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8080"   # proxy API (OpenAI-compatible)
      - "${METRICS_PORT:-9090}:9090"   # Prometheus metrics
    environment:
      GUARD_ENV: ${GUARD_ENV:-}
      # The password comes from PGPASSWORD so that it is never part of a URL here.
      DATABASE_URL: postgres://guardspec_app@postgres:5432/${POSTGRES_DB:-guardspec}?sslmode=disable
      PGPASSWORD: ${GUARDSPEC_APP_PASSWORD:-${PS_APP_PASSWORD:-}}
      # Audit rows keep hashes and lengths only; true also stores the content.
      AUDIT_STORE_CONTENT: ${AUDIT_STORE_CONTENT:-false}
      # Detection layers (internal/inference/ml). L1 rules always load; L2 (our
      # classifier) and L3 (e5 embeddings) load from ./models, mounted read-only
      # below. Missing models: the gateway warns and runs L1 only, unless
      # DETECTOR_REQUIRE_ML=true outside GUARD_ENV=dev, which refuses to start.
      # Fetch them with:
      #   docker compose --profile models run --rm models-pull   # e5 -> ./models/cache/
      #   cp -R <training output>/guardspec-classifier-v1 ./models/local/   # see train/
      MODEL_DIR: /models
      L2_MODEL_DIR: ${L2_MODEL_DIR:-}            # default /models/local/guardspec-classifier-v1, then -v0
      L3_MODEL_DIR: ${L3_MODEL_DIR:-}            # default /models/cache/multilingual-e5-small
      DETECTOR_LAYERS: ${DETECTOR_LAYERS:-l1,l2,l3}
      DETECTOR_FUSION: ${DETECTOR_FUSION:-logreg} # or max
      DETECTOR_CASCADE: ${DETECTOR_CASCADE:-false} # true: skip L2/L3 when L1 is decisive
      DETECTOR_REQUIRE_ML: ${DETECTOR_REQUIRE_ML:-false}
      # internal/onnx: bound on concurrent model runs (default: CPU count) and
      # ORT threads per run (default: ORT picks). ONNXRUNTIME_LIB is set in the image.
      INFERENCE_MAX_CONCURRENCY: ${INFERENCE_MAX_CONCURRENCY:-}
      INFERENCE_INTRA_OP_THREADS: ${INFERENCE_INTRA_OP_THREADS:-}
      # Base URL of an OpenAI-compatible API, such as http://host.docker.internal:11434/v1.
      # Leave empty for stub responses.
      UPSTREAM_LLM_URL: ${UPSTREAM_LLM_URL:-}
      UPSTREAM_LLM_KEY: ${UPSTREAM_LLM_KEY:-}
      UPSTREAM_LLM_TIMEOUT: ${UPSTREAM_LLM_TIMEOUT:-}
      # Keys of named upstreams (routing): an upstream's api_key_env names one
      # of these. Add a line per key; only UPSTREAM_KEY_* names are read.
      UPSTREAM_KEY_MAIN: ${UPSTREAM_KEY_MAIN:-}
      # Which orgs may use which key variable (same value as the control
      # plane's). "*" lets every org use UPSTREAM_KEY_MAIN: fine for one team,
      # not for a stack where untrusted users create orgs. See README, Routing.
      UPSTREAM_KEY_ORGS: "${UPSTREAM_KEY_ORGS:-UPSTREAM_KEY_MAIN=*}"
      # true lets org-defined upstreams reach loopback and private addresses,
      # such as Ollama on the host. Set false when org admins are not trusted
      # with the gateway's network.
      UPSTREAM_ALLOW_PRIVATE: ${UPSTREAM_ALLOW_PRIVATE:-true}
      # Prometheus metrics on their own port, not on the API port.
      METRICS_ADDR: ":9090"
      # Per-key limits; a key's own rpm_limit / tpm_limit wins. 0 = unlimited.
      # Counted per gateway replica.
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-0}
      RATE_LIMIT_TPM: ${RATE_LIMIT_TPM:-0}
      # Alert events (docs/alerts.md): the flagged score; ALERTS_EVENTS=off stops them.
      ALERTS_FLAG_THRESHOLD: ${ALERTS_FLAG_THRESHOLD:-0.5}
      # Tracing is on only when an OTLP/HTTP endpoint is set.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_PROPAGATE_UPSTREAM: ${OTEL_PROPAGATE_UPSTREAM:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./models:/models:ro   # model files are mounted, never baked into the image
    depends_on:
      postgres:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  control-plane:
    image: guard-spec-control-plane:latest
    build:
      context: .
      dockerfile: build/control-plane.Dockerfile
    ports:
      - "${CONTROL_PLANE_PORT:-18081}:8081"
      - "${CONTROL_PLANE_METRICS_PORT:-9091}:9091"   # Prometheus metrics
    environment:
      GUARD_ENV: ${GUARD_ENV:-}
      DATABASE_URL: postgres://guardspec_app@postgres:5432/${POSTGRES_DB:-guardspec}?sslmode=disable
      PGPASSWORD: ${GUARDSPEC_APP_PASSWORD:-${PS_APP_PASSWORD:-}}
      JWT_SECRET: ${JWT_SECRET:-}
      # The first owner is created only when both are set.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      # The gateway's upstream, shown by the policy simulator (credentials hidden).
      UPSTREAM_LLM_URL: ${UPSTREAM_LLM_URL:-}
      # Which orgs may name which key variable; checked when upstreams are
      # saved. No default here (unlike the gateway's): set UPSTREAM_KEY_ORGS
      # in .env for both. The dev override opts in.
      UPSTREAM_KEY_ORGS: "${UPSTREAM_KEY_ORGS:-}"
      # Connection tests (owner only) reach out from the control plane: they
      # stay off private addresses unless this is true, and send a key only
      # to orgs UPSTREAM_KEY_ORGS lists by id (not through "*"). Give the
      # control plane UPSTREAM_KEY_* variables only if you want tests to use them.
      UPSTREAM_ALLOW_PRIVATE: ${CONTROL_PLANE_UPSTREAM_ALLOW_PRIVATE:-false}
      # Client address behind a reverse proxy: comma-separated CIDRs whose
      # X-Forwarded-For is believed. Empty: the header is ignored.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Encrypts TOTP 2FA secrets: 32 random bytes, base64 (openssl rand -base64 32).
      # Keep it: losing it disables every user's 2FA.
      MFA_ENC_KEY: ${MFA_ENC_KEY:-}
      # External origin of the control plane, for SSO callback urls.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Client secrets of SSO providers; a provider names its variable.
      OIDC_SECRET_GOOGLE: ${OIDC_SECRET_GOOGLE:-}
      # Alerts (docs/alerts.md). Channel secrets are variables a channel names
      # in secret_env; ALERTS_SECRET_ORGS says which orgs may name which.
      ALERTS_SECRET_ORGS: ${ALERTS_SECRET_ORGS:-}
      ALERTS_PRIVATE_ORGS: ${ALERTS_PRIVATE_ORGS:-}
      ALERTS_EMAIL_DAILY_CAP: ${ALERTS_EMAIL_DAILY_CAP:-500}
      ALERTS_LANG: ${ALERTS_LANG:-en}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_POLLING: ${TELEGRAM_POLLING:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      METRICS_ADDR: ":9091"
      # Audit rows older than this are deleted hourly; 0 keeps them forever.
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
    depends_on:
      db-roles:
        condition: service_completed_successfully

  migrate:
    image: migrate/migrate:v4.20.1@sha256:76cc2074cb6642631f34a898ced71e6aeaa6b1a4d78c4daa743275a22e0c5be7
    command:
      - -path=/migrations
      - -database=postgres://ps@postgres:5432/${POSTGRES_DB:-guardspec}?sslmode=disable
      - up
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Sets the guardspec_app password from GUARDSPEC_APP_PASSWORD after migrating,
  # and refuses default or weak database passwords unless GUARD_ENV=dev.
  # PS_APP_PASSWORD, the old name, is still read for one release, with a warning.
  db-roles:
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    entrypoint: ["/bin/sh", "/set-app-password.sh"]
    environment:
      GUARD_ENV: ${GUARD_ENV:-}
      PGHOST: postgres
      PGUSER: ps
      PGDATABASE: ${POSTGRES_DB:-guardspec}
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      GUARDSPEC_APP_PASSWORD: ${GUARDSPEC_APP_PASSWORD:-}
      PS_APP_PASSWORD: ${PS_APP_PASSWORD:-}   # deprecated
    volumes:
      - ./deploy/postgres/set-app-password.sh:/set-app-password.sh:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  postgres:
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guardspec}   # fresh volumes only
      POSTGRES_USER: ps
      # Required on first start; the image refuses an empty one.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ps -d ${POSTGRES_DB:-guardspec}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Pulls the ONNX models in models/manifest.yaml into ./models/cache,
  # verifying SHA-256: docker compose --profile models run --rm models-pull
  # Our classifier is not on Hugging Face: copy guardspec-classifier-v0 (or v1)
  # into ./models/local/ yourself.
  models-pull:
    profiles: [models]
    image: guard-spec-gateway:latest
    build:
      context: .
      dockerfile: build/gateway.Dockerfile
    entrypoint: ["./models", "pull", "-manifest", "manifest.yaml", "-dir", "/models/cache"]
    user: "${MODELS_UID:-0}:${MODELS_GID:-0}"   # set to your uid/gid on Linux to own the files
    environment:
      HF_TOKEN: ${HF_TOKEN:-}   # only for gated optional baselines (protectai small v2)
    volumes:
      - ./models:/models
    restart: "no"

volumes:
  pgdata:
