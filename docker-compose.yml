# Secrets have no defaults here. Production: copy .env.example to .env, fill it
# in, and run `docker compose -f docker-compose.yml up -d` (so that the dev
# override is not loaded). The services refuse to start with missing, default
# or weak secrets unless GUARD_ENV=dev, which docker-compose.override.yml sets.

#
# Images: the released ones from ghcr.io (GUARDSPEC_VERSION picks the tag).
# Contributors build from source instead: `docker compose up --build` also
# loads docker-compose.override.yml, which adds the build sections (and
# GUARD_ENV=dev). On a clean machine, scripts/quickstart.sh writes a .env
# with strong secrets and starts this file alone.
#
# Models: the models-init service pulls the recommended models of
# models/manifest.yaml into ./models/cache/<name>/<version>/ before the
# gateway starts, verifying every SHA-256 (docs/models.md). It does nothing
# when they are already there.

# Default project name; -p or COMPOSE_PROJECT_NAME override it.
name: guard-spec

services:
  gateway:
    image: ghcr.io/guard-spec/guard-spec-gateway:${GUARDSPEC_VERSION:-0.8.0}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"   # proxy API (OpenAI-compatible, Anthropic Messages)
      - "${METRICS_PORT:-9090}:9090"   # Prometheus metrics
    environment:
      GUARD_ENV: ${GUARD_ENV:-}
      # The password comes from PGPASSWORD so that it is never part of a URL here.
      DATABASE_URL: postgres://guardspec_app@postgres:5432/${POSTGRES_DB:-guardspec}?sslmode=disable
      PGPASSWORD: ${GUARDSPEC_APP_PASSWORD:-}
      # Audit rows keep hashes and lengths only; true also stores the content.
      AUDIT_STORE_CONTENT: ${AUDIT_STORE_CONTENT:-false}
      # Encrypts stored content (with AUDIT_STORE_CONTENT or an org's opt-in):
      # 32 random bytes, base64 (openssl rand -base64 32), the same on the
      # gateway and the control plane. Back it up: without it stored content
      # cannot be read. Vault Transit instead: docs/security/README.md#encryption.
      CONTENT_KEK: ${CONTENT_KEK:-}
      # Detection layers (internal/inference/ml). L1 rules always load; L2 (our
      # classifier) and L3 (e5 embeddings) load from ./models, mounted read-only
      # below and filled by models-init. Missing models: the gateway warns and
      # runs L1 only, unless DETECTOR_REQUIRE_ML=true outside GUARD_ENV=dev,
      # which refuses to start. Pick a version with L2_MODEL=name@version (pull
      # it first: docs/models.md); a directory in L2_MODEL_DIR wins over it.
      MODEL_DIR: /models
      L2_MODEL: ${L2_MODEL:-}                    # default: the manifest's recommended classifier
      L2_MODEL_DIR: ${L2_MODEL_DIR:-}
      L3_MODEL: ${L3_MODEL:-}                    # default: the manifest's recommended embedder
      L3_MODEL_DIR: ${L3_MODEL_DIR:-}
      # l1,l2 is light mode: no L3 embedder, less RAM (docs/sizing.md).
      DETECTOR_LAYERS: ${DETECTOR_LAYERS:-l1,l2,l3}
      DETECTOR_FUSION: ${DETECTOR_FUSION:-logreg} # or max
      DETECTOR_CASCADE: ${DETECTOR_CASCADE:-false} # true: skip L2/L3 when L1 is decisive
      DETECTOR_REQUIRE_ML: ${DETECTOR_REQUIRE_ML:-false}
      # Shadow mode: a candidate classifier scored on the same traffic, never
      # deciding (README, Shadow mode and model reload).
      SHADOW_L2_MODEL: ${SHADOW_L2_MODEL:-}
      SHADOW_L2_MODEL_DIR: ${SHADOW_L2_MODEL_DIR:-}
      SHADOW_SAMPLE: ${SHADOW_SAMPLE:-1}
      SHADOW_TIMEOUT: ${SHADOW_TIMEOUT:-2s}
      # Manifest file for reloads and /readyz; empty: the image's built-in one.
      MODELS_MANIFEST: ${MODELS_MANIFEST:-}
      # Bearer token of POST /admin/models/reload; empty turns it off.
      # `docker compose kill -s HUP gateway` reloads without it.
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:-}
      # internal/onnx: bound on concurrent model runs (default: CPU count) and
      # ORT threads per run (default: ORT picks). ONNXRUNTIME_LIB is set in the image.
      INFERENCE_MAX_CONCURRENCY: ${INFERENCE_MAX_CONCURRENCY:-}
      INFERENCE_INTRA_OP_THREADS: ${INFERENCE_INTRA_OP_THREADS:-}
      # Large inputs (README "Large inputs"): empty keeps today's limits.
      MAX_SCAN_TOKENS: ${MAX_SCAN_TOKENS:-}
      INFERENCE_LARGE_MAX_CONCURRENCY: ${INFERENCE_LARGE_MAX_CONCURRENCY:-}
      LARGE_SCAN_ORG_CONCURRENCY: ${LARGE_SCAN_ORG_CONCURRENCY:-}
      LARGE_SCAN_QUEUE_TIMEOUT: ${LARGE_SCAN_QUEUE_TIMEOUT:-}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-}
      # Base URL of an OpenAI-compatible API, such as http://host.docker.internal:11434/v1.
      # Leave empty for stub responses.
      UPSTREAM_LLM_URL: ${UPSTREAM_LLM_URL:-}
      UPSTREAM_LLM_KEY: ${UPSTREAM_LLM_KEY:-}
      UPSTREAM_LLM_TIMEOUT: ${UPSTREAM_LLM_TIMEOUT:-}
      # Keys of named upstreams (routing): an upstream's api_key_env names one
      # of these. Add a line per key; only UPSTREAM_KEY_* names are read.
      UPSTREAM_KEY_MAIN: ${UPSTREAM_KEY_MAIN:-}
      # Which orgs may use which key variable (same value as the control
      # plane's). "*" lets every org use UPSTREAM_KEY_MAIN: fine for one team,
      # not for a stack where untrusted users create orgs. See README, Routing.
      UPSTREAM_KEY_ORGS: "${UPSTREAM_KEY_ORGS:-UPSTREAM_KEY_MAIN=*}"
      # true lets org-defined upstreams reach loopback and private addresses,
      # such as Ollama on the host. Set false when org admins are not trusted
      # with the gateway's network.
      UPSTREAM_ALLOW_PRIVATE: ${UPSTREAM_ALLOW_PRIVATE:-true}
      # Prometheus metrics on their own port, not on the API port.
      METRICS_ADDR: ":9090"
      # Per-key limits; a key's own rpm_limit / tpm_limit wins. 0 = unlimited.
      # Counted per gateway replica.
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-0}
      RATE_LIMIT_TPM: ${RATE_LIMIT_TPM:-0}
      # Scan cache (README, Scan cache): memory (this replica), postgres (the
      # gateway's database) or redis, shared by every replica. For redis, start
      # the scan-cache service (--profile scan-cache) and set
      # SCAN_CACHE_REDIS_URL=redis://:<SCAN_CACHE_REDIS_PASSWORD>@scan-cache:6379/0.
      SCAN_CACHE_BACKEND: ${SCAN_CACHE_BACKEND:-memory}
      SCAN_CACHE_REDIS_URL: ${SCAN_CACHE_REDIS_URL:-}
      # Alert events (docs/alerts.md): the flagged score; ALERTS_EVENTS=off stops them.
      ALERTS_FLAG_THRESHOLD: ${ALERTS_FLAG_THRESHOLD:-0.5}
      # Tracing is on only when an OTLP/HTTP endpoint is set.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_PROPAGATE_UPSTREAM: ${OTEL_PROPAGATE_UPSTREAM:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./models:/models:ro   # model files are mounted, never baked into the image
    depends_on:
      postgres:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
      models-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/gateway", "health", "/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  control-plane:
    image: ghcr.io/guard-spec/guard-spec-control-plane:${GUARDSPEC_VERSION:-0.8.0}
    ports:
      - "${CONTROL_PLANE_PORT:-18081}:8081"
      - "${CONTROL_PLANE_METRICS_PORT:-9091}:9091"   # Prometheus metrics
    environment:
      GUARD_ENV: ${GUARD_ENV:-}
      DATABASE_URL: postgres://guardspec_app@postgres:5432/${POSTGRES_DB:-guardspec}?sslmode=disable
      PGPASSWORD: ${GUARDSPEC_APP_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      # The first owner is created only when both are set.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      # The gateway's upstream, shown by the policy simulator (credentials hidden).
      UPSTREAM_LLM_URL: ${UPSTREAM_LLM_URL:-}
      # Where the Models page reads the gateway's /readyz (server side).
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:8080}
      # Which orgs may name which key variable; checked when upstreams are
      # saved. No default here (unlike the gateway's): set UPSTREAM_KEY_ORGS
      # in .env for both. The dev override opts in.
      UPSTREAM_KEY_ORGS: "${UPSTREAM_KEY_ORGS:-}"
      # Connection tests (owner only) reach out from the control plane: they
      # stay off private addresses unless this is true, and send a key only
      # to orgs UPSTREAM_KEY_ORGS lists by id (not through "*"). Give the
      # control plane UPSTREAM_KEY_* variables only if you want tests to use them.
      UPSTREAM_ALLOW_PRIVATE: ${CONTROL_PLANE_UPSTREAM_ALLOW_PRIVATE:-false}
      # Client address behind a reverse proxy: comma-separated CIDRs whose
      # X-Forwarded-For is believed. Empty: the header is ignored.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Encrypts TOTP 2FA secrets: 32 random bytes, base64 (openssl rand -base64 32).
      # Keep it: losing it disables every user's 2FA.
      MFA_ENC_KEY: ${MFA_ENC_KEY:-}
      # Opens the stored content the gateway encrypted (same value as there).
      CONTENT_KEK: ${CONTENT_KEK:-}
      # Signs the activity log's hash chains every AUDIT_ANCHOR_INTERVAL (1h):
      # an Ed25519 seed, 32 random bytes in base64 (openssl rand -base64 32).
      AUDIT_SIGNING_KEY: ${AUDIT_SIGNING_KEY:-}
      # External origin of the control plane, for SSO callback urls.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Client secrets of SSO providers; a provider names its variable.
      OIDC_SECRET_GOOGLE: ${OIDC_SECRET_GOOGLE:-}
      # Alerts (docs/alerts.md). Channel secrets are variables a channel names
      # in secret_env; ALERTS_SECRET_ORGS says which orgs may name which.
      ALERTS_SECRET_ORGS: ${ALERTS_SECRET_ORGS:-}
      ALERTS_PRIVATE_ORGS: ${ALERTS_PRIVATE_ORGS:-}
      ALERTS_EMAIL_DAILY_CAP: ${ALERTS_EMAIL_DAILY_CAP:-500}
      ALERTS_LANG: ${ALERTS_LANG:-en}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_POLLING: ${TELEGRAM_POLLING:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      METRICS_ADDR: ":9091"
      # Audit rows older than this are deleted hourly; 0 keeps them forever.
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      # Same job: activity log rows older than this; sessions revoked or
      # expired more than this many days ago (active ones stay). 0 keeps them.
      ACTIVITY_LOG_RETENTION_DAYS: ${ACTIVITY_LOG_RETENTION_DAYS:-365}
      SESSION_RETENTION_DAYS: ${SESSION_RETENTION_DAYS:-30}
    depends_on:
      db-roles:
        condition: service_completed_successfully

  migrate:
    image: migrate/migrate:v4.20.1@sha256:76cc2074cb6642631f34a898ced71e6aeaa6b1a4d78c4daa743275a22e0c5be7
    command:
      - -path=/migrations
      - -database=postgres://ps@postgres:5432/${POSTGRES_DB:-guardspec}?sslmode=disable
      - up
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Sets the guardspec_app password from GUARDSPEC_APP_PASSWORD after migrating,
  # and refuses default or weak database passwords unless GUARD_ENV=dev.
  db-roles:
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    entrypoint: ["/bin/sh", "/set-app-password.sh"]
    environment:
      GUARD_ENV: ${GUARD_ENV:-}
      PGHOST: postgres
      PGUSER: ps
      PGDATABASE: ${POSTGRES_DB:-guardspec}
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      GUARDSPEC_APP_PASSWORD: ${GUARDSPEC_APP_PASSWORD:-}
    volumes:
      - ./deploy/postgres/set-app-password.sh:/set-app-password.sh:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  postgres:
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guardspec}   # fresh volumes only
      POSTGRES_USER: ps
      # Required on first start; the image refuses an empty one.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ps -d ${POSTGRES_DB:-guardspec}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Runs before the gateway on every `up`: pulls the recommended version of
  # every non-optional model in the image's manifest into
  # ./models/cache/<name>/<version>/ (Hugging Face, then the GitHub Release
  # mirror; MODELS_MIRROR is tried first when set), verifying SHA-256, and
  # does nothing when the files are present and verified. Light mode
  # (DETECTOR_LAYERS=l1,l2) pulls the L2 classifier only (L2_MODEL, else the
  # recommended guardspec-classifier), and l1 alone pulls nothing. When a pull fails
  # (offline, say) it warns and the gateway starts on the layers it can load,
  # unless DETECTOR_REQUIRE_ML=true, which makes the failure stop the stack.
  # Air-gapped: use the gateway-full image or a mirror (docs/models.md).
  models-init:
    image: ghcr.io/guard-spec/guard-spec-gateway:${GUARDSPEC_VERSION:-0.8.0}
    # models init reads DETECTOR_LAYERS, L2_MODEL and DETECTOR_REQUIRE_ML (the image has no shell).
    entrypoint: ["./models", "init", "-manifest", "manifest.yaml", "-dir", "/models/cache"]
    user: "${MODELS_UID:-0}:${MODELS_GID:-0}"   # set to your uid/gid on Linux to own the files
    environment:
      MODELS_MIRROR: ${MODELS_MIRROR:-}
      DETECTOR_REQUIRE_ML: ${DETECTOR_REQUIRE_ML:-false}
      DETECTOR_LAYERS: ${DETECTOR_LAYERS:-l1,l2,l3}
      L2_MODEL: ${L2_MODEL:-}
    volumes:
      - ./models:/models
    restart: "no"

  # Pulls other models or versions on demand, such as an older version to roll
  # back to or an optional baseline:
  #   docker compose --profile models run --rm models-pull guardspec-classifier@v3b
  # Without arguments it does what models-init does.
  models-pull:
    profiles: [models]
    image: ghcr.io/guard-spec/guard-spec-gateway:${GUARDSPEC_VERSION:-0.8.0}
    entrypoint: ["./models", "pull", "-manifest", "manifest.yaml", "-dir", "/models/cache"]
    user: "${MODELS_UID:-0}:${MODELS_GID:-0}"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}   # only for gated optional baselines (protectai small v2)
      MODELS_MIRROR: ${MODELS_MIRROR:-}
    volumes:
      - ./models:/models
    restart: "no"

  # Shared scan cache for SCAN_CACHE_BACKEND=redis (Valkey, Redis-compatible,
  # BSD licensed): docker compose --profile scan-cache up -d. In memory only
  # (a restart empties it, which only costs rescans), no published port, and a
  # password is required: whoever can write to it can mark content as clean.
  scan-cache:
    profiles: [scan-cache]
    image: valkey/valkey:8.1.4-alpine@sha256:e706d1213aaba6896c162bb6a3a9e1894e1a435f28f8f856d14fab2e10aa098b
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ "$${#SCAN_CACHE_REDIS_PASSWORD}" -lt 16 ]; then
          echo "scan-cache: set SCAN_CACHE_REDIS_PASSWORD (16 characters or more) in .env" >&2; exit 1
        fi
        exec valkey-server --requirepass "$$SCAN_CACHE_REDIS_PASSWORD" --save "" --appendonly no \
          --maxmemory "$${SCAN_CACHE_REDIS_MAXMEMORY:-256mb}" --maxmemory-policy volatile-lru
    environment:
      SCAN_CACHE_REDIS_PASSWORD: ${SCAN_CACHE_REDIS_PASSWORD:-}
      SCAN_CACHE_REDIS_MAXMEMORY: ${SCAN_CACHE_REDIS_MAXMEMORY:-256mb}
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$SCAN_CACHE_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
