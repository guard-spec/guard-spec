# Sources of the v5 training data (train/data/build_v5.py, task RF-437128e9).
#
# Only this file is committed: build_v5.py downloads each source at the pinned
# revision into $GUARD_V5_CACHE (default train/.cache/v5, gitignored), checks
# the SHA-256 values below, and writes windows to $GUARD_BUILD_OUT, outside
# the repository. No third-party text is written inside the repository.
#
# Pins:
#   archive_sha256  SHA-256 of the downloaded archive. GitHub generates its
#                   tarballs on demand; a mismatch is reported but not fatal,
#                   because content_sha256 is the real check.
#   content_sha256  SHA-256 of the selected, extracted text: sha256 over the
#                   sorted lines "<path>\0<sha256 of the file's UTF-8 text>\n"
#                   (for git-log sources, of the log text; for http-html and
#                   mediawiki sources, of the extracted units joined by
#                   "\n\x1e\n", as bench/long/build.py does). Fatal on mismatch.
#   An empty value means "not pinned yet": the builder prints the value to pin.
#
# Template sets (DATA_CARD.md "v5"):
#   A  set A: training + a 12% validation split by group (file / unit)
#   B  val_v5: arm selection and calibration; other repositories, titles,
#      works and generator templates than A
#   C  val_v5_holdout: never used for selection; other repositories, titles,
#      works and templates than A and B
#
# Licences were checked on each repository at the pinned tag (the licence
# file named below must exist and contain `license_match`; the builder
# refuses the source otherwise). Vendored or third-party directories are
# excluded because their licences differ from the repository's.

version: 1

tokenizer:
  # Base model of the classifier (MODEL_CARD.md), same vocabulary as the
  # packaged v3b/v4 tokenizers. Content tokens, no special tokens.
  repo: intfloat/multilingual-e5-small
  revision: 614241f622f53c4eeff9890bdc4f31cfecc418b3
  file: tokenizer.json
  sha256: 0b44a9d7b51c3c62626640cda0e2c2f70fdacdc25bbbd68038369d14ebdf4c39

