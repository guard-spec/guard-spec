    sha256: 0104bff3852e0bf93c5672ff72cde36dbc0ddf8e7cb7b4a47de512c55962c68a

# The pool: as sources_r8c.yaml (documents of about 30k tokens per genre, sanitized by the gateway's sanitizer).
pool:
  doc_tokens: 30000

# Host windows per genre: a seeded sample of the gateway windows of the sanitized pool; each gets one payload
# and only the attack row is written (L+ has no benign rows).
windows:
  docs: 450
  rfc: 300
  readme: 250

payloads:
  file: data/train.jsonl
  langs: [en]
  min_chars: 30
  max_chars: 600
  max_tokens: 170
  payload_set: A
placements:
  mid: 0.30
  split_adjacent: 0.15
  split_within: 0.15
  straddle_window: 0.15
  start: 0.125
  end: 0.125
# Bridge sentences of split_adjacent: other sentences than bench/long's, build_v5's, sources_v8.yaml's and
# sources_r8c.yaml's.
bridges:
  en:
    - "The next paragraph covers the remaining options."
    - "Refer to the release notes for version differences."
    - "Default values are listed at the end of this page."
    - "This section assumes a working installation."

# N: hard negatives of negated or quoted overrides (data/r8d_templates.py).
negatives:
  rows: 400
  vi_share: 0.5

guard:
  profiles: [quick, full, long, long5, long6, long7, long8, long9, long10]
