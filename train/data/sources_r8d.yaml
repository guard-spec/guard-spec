  datadog-readme-r8d-en:
    lang: en
    genre: readme
    kind: github-tree
    # README files of the Datadog Agent integrations (DataDog/integrations-core at a pinned commit of master, the
    # whole tree, BSD-3-Clause).
    repo: DataDog/integrations-core
    commit: 20667183408fc0119daf1344692febe79c2cd846
    tree_sha: 920431864dbb6c21462162a5106f424ba9cf5071
