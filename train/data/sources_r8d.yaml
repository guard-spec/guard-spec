    repo: open-policy-agent/opa
    commit: ba39415db4b3c90cd68942a74b3cc2223ec2b23c
    prefix: docs
    tree_sha: dea94b39361486dd37f454b730ec7f438a3dadb0
    suffixes: [".md", ".mdx"]
    min_bytes: 2000
    strip: front-matter
    max_unit_chars: 60000
