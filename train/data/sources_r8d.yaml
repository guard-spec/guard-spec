    prefix: content/docs
    tree_sha: d136216d6722c053d5be46e28ff1a0f960aff73b
    suffixes: [".md"]
    min_bytes: 2000
    strip: front-matter
    max_unit_chars: 60000
    license: Apache-2.0 (cert-manager/website LICENSE)
    terms: GitHub tree API and raw file URLs at a pinned commit; training rows are not redistributed.
    sha256: 899168f0d3c62c9ff23ff833610387da3f6181f9a8ec1d3f8648f253b540d70c
  rfc-r8d-en:
    lang: en
    genre: rfc
    kind: http-text
    # RFCs no profile, no earlier training source, long9, long10 and R8c's L use (IETF Trust Legal Provisions,
    # BCP 78): the 815 candidates of corpus.yaml `rfc-l9-en`, every twentieth from the eighth.
    base: https://www.rfc-editor.org/rfc/
    file_header: ""
    strip: rfc
    max_unit_chars: 60000
    paths:
      - rfc2127.txt
      - rfc2412.txt
      - rfc2677.txt
      - rfc2895.txt
      - rfc3196.txt
