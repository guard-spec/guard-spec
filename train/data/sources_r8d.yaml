# Inputs and recipe of the R8d training additions L+ and N (RF-e82b0347, data/build_r8d.py).
#
# Copyright The Guard Spec Authors. Licensed under the Apache License 2.0.
#
# R8c's arm EPL (train/reports/r8c_report.md) was not met: EPL-s2 caught 83.9% of long9's embedded attacks against
# a bar of 84.9%, and EPL-s1 blocked 4 of 60 benign split1 conversations, three of them "don't ignore the previous
# instructions". R8d keeps EPL's data and adds:
#   L+  payload-carrying windows only (the build_v8 scheme, training payload set A, English hosts) in long technical
#       documentation from new sources, so that L's benign : attack goes from 1 : 1 to about 1 : 1.7;
#   N   hard negatives of negated or quoted overrides ("don't ignore the previous instructions", "làm theo hướng dẫn
#       trước đó", quotes and discussions of prompt injection), single texts and turns joined with a space.
#
# Same schema and loader as sources_r8c.yaml. Disjointness: other repositories and RFCs than every bench/long
# profile (long9 and long10 included), every earlier training source and R8c's L.

version: 1
seed: 20261120

sources:
  airflow-docs-r8d-en:
    lang: en
    genre: docs
    kind: github-tree
    # The Apache Airflow documentation (apache/airflow at the 3.4.0 tag, airflow-core/docs,
    # reStructuredText, Apache-2.0); with OPA and cert-manager one `docs` pool.
    repo: apache/airflow
    commit: 619a787ac81e8b7c8a9102fc78e3f0b00625d04e
    prefix: airflow-core/docs
    tree_sha: a2c89d444cff4c35d13195ef95c7cbb249215753
    suffixes: [".rst"]
    min_bytes: 2000
    max_unit_chars: 60000
    license: Apache-2.0 (apache/airflow LICENSE)
    terms: GitHub tree API and raw file URLs at a pinned commit; training rows are not redistributed.
    sha256: f98b88ef46032bdb4658bf74564191d936d28eba0b33ba98040166e8736b334d
  opa-docs-r8d-en:
    lang: en
    genre: docs
    kind: github-tree
