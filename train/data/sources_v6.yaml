# Sources of the v6 training data (train/data/build_v6.py, task RF-895d3533).
#
# v6 is the v5 recipe (sources_v5.yaml, same repositories at the same tags
# and commits) plus:
#   - `doc_en`: README, docs and API prose (Markdown / reStructuredText / plain
#     text) of the already pinned code repositories, as English hard negatives
#     and as a source of benign prose fillers for the twins of the embedded
#     positives (build_v6.py, "benign twins");
#   - `secdoc_en`: documentation that explains or discusses prompt injection,
#     jailbreaks and their defences, from permissively licensed repositories
#     (hard negatives about security);
#   - more vi.wikisource laws (PVCC-CPVN) and pre-1900 works (PD-old), none of
#     them a work bench/long uses (its revisions are listed under `excluded`).
# Adding a `select` kind changes a source's extracted content, so the
# content_sha256 pins of the changed sources were computed again for v6; the
# archive pins are the same files as v5's.
#
# Only this file is committed: build_v6.py downloads each source at the pinned
# revision into $GUARD_V6_CACHE (default train/.cache/v6, gitignored), checks
# the SHA-256 values below, and writes rows to $GUARD_BUILD_OUT, outside the
# repository. No third-party text is written inside the repository.
#
# Pins:
#   archive_sha256  SHA-256 of the downloaded archive. GitHub generates its
#                   tarballs on demand; a mismatch is reported but not fatal,
#                   because content_sha256 is the real check.
#   content_sha256  SHA-256 of the selected, extracted text: sha256 over the
#                   sorted lines "<path>\0<sha256 of the file's UTF-8 text>\n"
#                   (for git-log sources, of the log text; for http-html and
#                   mediawiki sources, of the extracted units joined by
#                   "\n\x1e\n", as bench/long/build.py does). Fatal on mismatch.
#   An empty value means "not pinned yet": the builder prints the value to pin.
#
# Template sets (DATA_CARD.md "v6 data"):
#   A  set A: training + a 12% validation split by group (file / unit / host)
#   B  val_v6: arm selection and calibration; other repositories, titles,
#      works and generator templates than A
#   C  val_v6_holdout: never used for selection; other repositories, titles,
#      works and templates than A and B
#
# Licences were checked on each repository at the pinned tag (the licence
# file named below must exist and contain `license_match`; the builder
# refuses the source otherwise). Vendored or third-party directories are
# excluded because their licences differ from the repository's. Policy
# (DATA_LICENSES.md): permissive or public domain only; no CC-BY-SA, no
# non-commercial, no unlicensed source.

