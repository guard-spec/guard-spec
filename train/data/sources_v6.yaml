# Never used, at source level (DATA_CARD.md "v6 data"):
excluded:
  - source: golang/go (Go standard library)
    reason: bench/long gostd-en uses it; evaluation data.
  - source: Wikipedia (any language)
    reason: CC-BY-SA (share-alike would follow the data) and bench/long wiki genre.
  - source: vi.wikisource revisions of bench/long (206607, 106606, 106607, 136234, 199539, 111231, 198701, 126727, 175413, 112144, 139826) and every other version of those laws or works
    reason: bench/long evaluation corpus; other versions are near-duplicates. Checked again for v6 by title (train/tests/test_sources_v6.py) and by the 50-token shingle guard (bench_guard.py).
  - source: U.S. Code titles 11, 17 and 35
    reason: bench/long uscode-en.
  - source: this repository (Guard Spec), at any commit
    reason: eval/codelog is built from it.
  - source: eval/codelog/build.py and bench/long/build.py message catalogs and seeds
    reason: evaluation templates; gen_codelog_v5.py and gen_filler_v6.py have their own (checked by train/tests).
  - source: OWASP Top 10 for LLM Applications, OWASP cheat sheets, Wikipedia "Prompt injection"
    reason: CC-BY-SA.
  - source: NIST AI 100-2, CISA/NSA AI security guidance
    reason: public domain but PDF only; no PDF extractor in the builder's dependencies (candidate for a later round).
  - source: Azure/PyRIT, promptfoo
    reason: MIT, but their docs are notebooks / a very large repository; not needed.
  - source: garak probe modules and data, llm-guard tests, vigil data sets, NeMo examples
    reason: collections of attack prompts, not explanatory text.
  - source: golang/go-derived or CC-BY-SA configuration collections, Stack Overflow snippets, unlicensed prompt-injection write-ups
    reason: share-alike, non-commercial or unclear licence.
