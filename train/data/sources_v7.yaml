# Sources of the v7 training addition (RF-895d3533 R6, train/reports/v7_preregistration.md).
#
# Copyright The Guard Spec Authors. Licensed under the Apache License 2.0.
#
# Benign long text, English and Vietnamese, in the genres that still reach a blocking window on 100k to
# 200k-token documents (R5: role-play and "no restrictions" wording in fiction, secrets and download
# commands in technical documentation, a send verb with an address in RFC-like text) plus general long
# prose, Wikipedia, code and legal text. The schema is bench/long/corpus.yaml's `sources` (the same
# loader, bench/long/build.py load_source, with the same sha256 pins); `units_of` refers to a source of
# bench/long/corpus.yaml. Every source is public domain or under a licence that allows this use; no
# owner data. The text is never committed: data/build_v7.py downloads it into $GUARD_V7_CACHE.
#
# Disjointness: these are other files, row groups, titles, RFCs, repositories and sections than every
# bench/long profile (quick, full, long, long5, long6). build_v7.py drops every unit that shares a run of
# 50 classifier tokens with a document of those profiles, with the R5 and long6 embedded-attack
# documents, or with a hold-out row (eval/, val_*_holdout, the owner hold-outs), and reports the counts.
#
# `role`: `pool` units are scored by v6 for hard-negative mining and sampled for training.

