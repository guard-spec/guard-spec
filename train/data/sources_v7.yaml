# Generated text (build_v7.py gen_unit, project-written, Apache-2.0, seed below): benign passages in
# the three R5 genres, English and Vietnamese, from templates that share no sentence with
# bench/long's synthetic genres.
generated:
  seed: 20261114
  genres: [fiction_roleplay, tech_secrets, rfc_send]
  langs: [en, vi]
  units_per_genre_lang: 160

# Window budget of the random sample per genre and language (windows of the gateway's long path,
# 256 tokens with a 64-token overlap, cut from the v6 mining run's dump), the mining rule and the cap.
sample:
  seed: 20261114
  windows:
    wiki-en: 900
    prose-en: 1500
    docs-en: 1500
    rfc-en: 1000
    legal-en: 500
    code-en: 600
    wiki-vi: 2600
    prose-vi: 900
    docs-vi: 400
mine:
  # A pool window is a hard negative when v6 (INT8, CPU, cmd/benchlong -long on) gives it a fused
  # long-path score of at least 0.5 or a calibrated L2 of at least 0.3.
  fused_at_least: 0.5
  l2_at_least: 0.3
  cap_per_lang: 1500
