# The pool: every unit of the sources above that the guard keeps, in documents of about 30k tokens per genre
# (build_v7's pool format), sanitized by the gateway's sanitizer (stage `sanitize`).
pool:
  doc_tokens: 30000

# Benign windows per genre: a seeded sample of the gateway windows (254 content tokens, a new window every
# 190) of the sanitized pool documents, kind `r8c_benign`; windows under 200 characters are skipped.
windows:
  docs: 550
  rfc: 350
  readme: 300
  man: 300

# Payloads, placements and bridges: as sources_v8.yaml (attack rows of data/train.jsonl, payload set A),
# with this file's seed, so the payload order differs from v8's. The hosts are English, so the payloads are
# English, as build_v8 matches the payload's language to the host's.
payloads:
  file: data/train.jsonl
  langs: [en]
  min_chars: 30
  max_chars: 600
  max_tokens: 170
  payload_set: A
placements:
  mid: 0.30
  split_adjacent: 0.15
  split_within: 0.15
  straddle_window: 0.15
  start: 0.125
  end: 0.125
# Bridge sentences of split_adjacent: other sentences than bench/long's, build_v5's and sources_v8.yaml's.
bridges:
  en:
    - "The table below summarises the defaults."
    - "Each option is described in turn."
    - "See the configuration reference for the full list."
    - "This behaviour changed in a later release."

# S: payload-splitting attacks and hard negatives (data/build_r8c.py, templates of their own).
split:
  attack: 400
  benign: 400
  vi_share: 0.5

# The guard: no row may share a run of 50 classifier tokens with a document of these bench/long profiles,
# with the embedded-attack documents given with --embedded, or with a hold-out row (eval/, val_*_holdout,
# persona1, persona2, persona3, split1, multiturn.json, the payload_split dev set, the L3 exemplars and the
# files given with --holdout-rows); hold-out rows under 50 tokens are checked with 12-token runs, and every
# S row also with build_short1's 8-word shingles (containment 0.5).
guard:
  profiles: [quick, full, long, long5, long6, long7, long8, long9]
