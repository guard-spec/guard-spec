# Inputs and recipe of the R8c training additions L and S (RF-f9e76bb6, data/build_r8c.py).
#
# Copyright The Guard Spec Authors. Licensed under the Apache License 2.0.
#
# R8b's arm E+P (persona hard negatives) blocked 4 of 150 benign long English technical documents of long5
# (docs and RFCs) against a bar of 1. `L` adds benign gateway windows of long technical documentation
# (documentation sites, RFCs, README files, man pages) and, for each, one window of the same host with a
# training payload embedded, exactly the build_v8 scheme (1 : 1 by rows). `S` adds payload-splitting attacks
# (turns joined with a space, as the conversation window joins them) and their hard negatives from templates
# of their own (data/build_r8c.py).
#
# The schema of `sources` is bench/long/corpus.yaml's (the same loader, bench/long/build.py load_source, the
# same sha256 pins). Every source is under a licence that allows this use; no owner data. The text is never
# committed. Disjointness: other repositories and RFCs than every bench/long profile (long5 to long9
# included), every earlier training source (sources_v5 to v8, DATA_LICENSES.md) and the `long9` sources;
# build_r8c.py drops every unit that shares a run of 50 classifier tokens with a bench/long document, an
# embedded-attack document or a hold-out row, and stage `check` checks the final rows again.

version: 1
seed: 20261119

sources:
  envoy-docs-r8c-en:
    lang: en
    genre: docs
    kind: github-tree
    # The Envoy documentation (envoyproxy/envoy at the v1.40.2 tag, docs/root, reStructuredText,
