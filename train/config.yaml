# Guard Spec attack-risk classifier v3 (v1, v2: task N6). Read by train.py, export.py and evaluate.py.
name: guardspec-classifier-v3
seed: 20261105

base_model: intfloat/multilingual-e5-small
# License MIT (model card front matter, checked at this revision).
base_revision: 614241f622f53c4eeff9890bdc4f31cfecc418b3

labels: [benign, direct_injection, indirect_injection, jailbreak, prompt_extraction,
         data_exfiltration, tool_poisoning, obfuscation]

data:
  train: data/train.jsonl
  # Early stopping and calibration use both validation files: the in-distribution group split and the
  # harder split built from v1 template set B (data/gen_hardneg.py), which training never sees, and (v2) the
  # Vietnamese variant split from template set B of data/gen_vi_v2.py with held-out teencode spellings.
  # (v3) adds val_v3, template set B of data/gen_v3.py (English hard negatives, Vietnamese admin/meta text).
  # data/val_v3_holdout.jsonl (template set C) is NOT listed here: it is never used for selection or calibration.
  val: [data/val.jsonl, data/val_hard.jsonl, data/val_vi_variants.jsonl, data/val_v3.jsonl]

train:
  max_len: 256
  batch_size: 32
  epochs: 5
  lr: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  grad_clip: 1.0
  # v3: realistic formal Vietnamese (data/realistic, with diacritics) seen twice per epoch, benign and attack alike.
  oversample:
    "guard-spec:realistic-fable/vi/orig": 2
  label_smoothing: 0.0          # v3: BCE targets y*(1-e) + e/2 when > 0 (training loss only)
  early_stopping_patience: 1   # epochs without improvement of validation loss (v0 selected on TPR@1%FPR)
  device: mps                   # falls back to cpu when MPS is unavailable
  # v2: rewrite Vietnamese `orig` training rows on the fly, same probability for benign and attack rows.
  augment:
    vi_no_diacritics: 0.15
    vi_teencode: 0.15

calibration:
  target_benign_fpr: 0.01       # overall risk score threshold on the validation split

export:
  opset: 17
  out_dir: ../models/local/guardspec-classifier-v3
  run_dir: runs/guardspec-classifier-v3

compare:
  # The requested protectai/deberta-v3-small-prompt-injection-v2 (rev d7c8842daf06) is gated on Hugging Face
  # (login + access request) and no token is available on the build machine, so we compare against the
  # ungated base-size sibling from the same family. Apache-2.0.
  model: protectai/deberta-v3-base-prompt-injection-v2
  revision: 90c9989b1a342275dd0d1a95aad283c04e075671
  max_len: 512
